function busy(on) {
  $("refreshBtn").disabled = on; $("refreshBtn").classList.toggle("loading", on);
  $("refreshLabel").textContent = on ? "Refreshing…" : "Refresh";
}

function updateStatus() {
  const s = currentStage() === "club" && !setup ? { lastUpdated: club.lastUpdated, error: club.failed.length && !club.lastUpdated } : slot(current().id);
  if (!s.lastUpdated) { $("status").textContent = s.error ? "Couldn't load results" : "Loading results…"; return; }
  const mins = Math.floor((Date.now() - s.lastUpdated) / 60000);
  const time = s.lastUpdated.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const ago = mins < 1 ? "just now" : mins === 1 ? "1 minute ago" : `${mins} minutes ago`;
  $("status").innerHTML = `Updated ${time} <span class="${mins >= 10 ? "stale" : ""}">(${ago})</span>`;
}

/* "Rolling" matches ("Follows previous match") get an estimated start: 45 minutes after
   the previous match on the same court (its listed time, or its own estimate), or after
   the previous match in the pool when there's no court. Returns the estimates (minutes
   after midnight) by match, null where the sheet gives a time. */
const MATCH_MINUTES = 45;
const toMinutes = t => { const x = String(t).match(/(\d{1,2}):(\d{2})\s*([ap])\.?\s*m/i); return x ? (+x[1] % 12 + (/p/i.test(x[3]) ? 12 : 0)) * 60 + +x[2] : null; };
const clock = n => { const h = Math.floor(n / 60) % 24; return `${h % 12 || 12}:${String(n % 60).padStart(2, "0")} ${h >= 12 ? "PM" : "AM"}`; };
function estimateStarts(matches) {
  // Kept per day, so a Saturday match never follows on from Friday's times
  const lastOnCourt = {}, lastInPool = {};
  return matches.map(m => {
    let start = toMinutes(m.time), est = null;
    const day = String(m.day || ""), court = day + "|" + (m.court || "");
    if (start == null && /rolling/i.test(m.time)) {
      const prev = m.court && lastOnCourt[court] != null ? lastOnCourt[court] : lastInPool[day];
      if (prev != null) start = est = prev + MATCH_MINUTES;
    }
    if (start != null) { if (m.court) lastOnCourt[court] = start; lastInPool[day] = start; }
    return est;
  });
}

/* ---------------- Volunteer spots ----------------
   The club's volunteer sheet has a row per game for each of our teams: Day, Time, Court, Eclipse Team,
   Home/Away, Opponent, Match ("B16u Pool A M4"), then one column per job (Line Judge, Bookkeeper,
   Scoreboard Operator, Libero Tracker). A blank job cell is an open spot, "N/A" means that team
   doesn't cover it (the home team gives a line judge and a bookkeeper; the visiting team a line judge,
   a scoreboard operator and a libero tracker), anything else is who signed up. It's read like the
   score sheets (public CSV); sign-ups go through the sheet's Apps Script (VOLUNTEER_SCRIPT), which
   only ever fills an empty cell. */
const vol = { rows: [], roles: [], at: 0, busy: false };
const VOL_INFO = ["day", "time", "court", "eclipse team", "team", "home/away", "opponent", "match"];
const volNorm = v => String(v || "").toLowerCase().replace(/pool/g, "").replace(/[^a-z0-9]/g, "");
const isNA = v => /^n\/?a$/i.test(String(v).trim());
// Division code for Match names and team codes: "G16u" for Girls 16U, "GJV" for Girls JV
const volShort = d => { const t = tagsOf(d); return t.gender && t.age ? t.gender[0] + (t.age === "JV" ? "JV" : t.age.toLowerCase()) : ""; };
// Our team's code in the sheet: "16UB1" for Boys 16U "Des Moines Eclipse (IA)- 1", "JVG" for Girls JV
const volTeamCode = (d, name) => { const t = tagsOf(d); return (t.age === "JV" ? "JV" : t.age) + (t.gender || " ")[0] + teamSuffix(name); };
// The club whose games get Volunteer buttons (and rows added when missing)
const VOL_CLUB = VIEWER_CONFIG.volunteerClub || DEFAULT_CLUB;
// Jobs each side covers; every other job column gets "N/A" on a row the page adds
const VOL_JOBS = { home: ["line judge", "bookkeeper"], away: ["line judge", "scoreboard operator", "libero tracker"] };
const volGames = new Map();
/* A game of ours: { key, match, newRows }. newRows are the sheet rows to add the first time
   its button is tapped when the sheet has none (the first team listed is the home team).
   g = { match, a, b, day, time, court } */
function volGame(d, g) {
  if (!g.match) return null;
  const key = volNorm(g.match);
  const ours = [g.a, g.b].map(n => !!n && clubOf(n).toLowerCase() === VOL_CLUB.toLowerCase());
  let newRows = [];
  if ((ours[0] || ours[1]) && g.a && g.b && vol.roles.length && volShort(d)) {
    const names = [g.a, g.b], word = VOL_CLUB.split(/\s+/).pop();
    const dk = dayKey(g.day), known = vol.rows.find(r => dayKey(r.day) === dk);
    const day = known ? known.day : dk ? dk[0].toUpperCase() + dk.slice(1) : "";
    const court = /FH\s*#?\s*(\d+)\s*$/i.test(g.court || "") ? "FH " + g.court.match(/(\d+)\s*$/)[1] : courtLabel(g.court);
    newRows = [0, 1].filter(i => ours[i]).map(i => {
      const side = i === 0 ? "home" : "away", other = names[1 - i];
      return { day, time: g.time || "", court, team: volTeamCode(d, names[i]), side: i === 0 ? "Home" : "Away",
        opp: ours[1 - i] ? `${volTeamCode(d, other)} (${word})` : other, match: g.match,
        cells: Object.fromEntries(vol.roles.map(role => [role, VOL_JOBS[side].includes(role.toLowerCase()) ? "" : "N/A"])) };
    });
  }
  if (!newRows.length && !volRowsFor(key).length) return null;
  const game = { key, match: g.match, newRows };
  volGames.set(key, game);
  return game;
}
// A pool match's Match name, as the sheet writes it: "G16u Pool A M1"
const volPoolMatch = (d, poolName, num) => volShort(d) && num ? `${volShort(d)} ${poolName} M${num}` : "";
/* A bracket match's Match name: its name on the tab ("G18u Gold Semi"), numbered when several
   share it, in order down and across the tab ("G18u Gold Quarter 1" to "4") */
function volBracketMatch(d, model, m) {
  if (!model._volNames) {
    const short = volShort(d), all = [];
    model.brackets.forEach(g => [...g.rounds, ...(g.extra || [])].forEach(rd => rd.matches.forEach(x => {
      let base = String(x.name || rd.name).trim();
      if (short && !volNorm(base).startsWith(volNorm(short))) base = `${short} ${base}`;
      all.push({ x, base });
    })));
    const names = new Map();
    const byBase = {}; all.forEach(e => (byBase[volNorm(e.base)] = byBase[volNorm(e.base)] || []).push(e));
    Object.values(byBase).forEach(list => {
      list.sort((u, v) => u.x.r - v.x.r || u.x.c - v.x.c);
      list.forEach((e, i) => names.set(e.x, list.length > 1 ? `${e.base} ${i + 1}` : e.base));
    });
    model._volNames = names;
  }
  return model._volNames.get(m) || "";
}
async function loadVolunteers(force) {
  const parts = linkParts(VOLUNTEER_SHEET);
  if (!parts || vol.busy || (!force && Date.now() - vol.at < 60000)) return;
  vol.busy = true;
  try {
    const rows = await fetchRows(parts);
    const h = rows.findIndex(r => r.some(v => /^match$/i.test(v.trim())));
    if (h >= 0) {
      const head = rows[h].map(v => v.trim());
      const col = name => head.findIndex(v => v.toLowerCase() === name);
      const c = { day: col("day"), time: col("time"), court: col("court"), team: col("eclipse team") >= 0 ? col("eclipse team") : col("team"), side: col("home/away"), opp: col("opponent"), match: col("match") };
      vol.roles = head.filter(v => v && !VOL_INFO.includes(v.toLowerCase()));
      vol.rows = rows.slice(h + 1).filter(r => (r[c.match] || "").trim()).map(r => ({
        day: r[c.day] || "", time: r[c.time] || "", court: r[c.court] || "", team: (r[c.team] || "").trim(), side: r[c.side] || "", opp: r[c.opp] || "",
        match: r[c.match].trim(), key: volNorm(r[c.match]),
        cells: Object.fromEntries(vol.roles.map(role => [role, (r[head.indexOf(role)] || "").trim()]))
      }));
      vol.at = Date.now();
    }
  } catch (e) { /* keep what we had; the buttons just don't show */ }
  vol.busy = false;
  render();
}
const volRowsFor = key => key ? vol.rows.filter(r => r.key === key) : [];
const volOpen = rows => rows.reduce((n, r) => n + vol.roles.filter(role => !r.cells[role] && !isNA(r.cells[role])).length, 0);
function volButton(game) {
  if (!game) return "";
  const key = game.key, rows = volRowsFor(key);
  if (!rows.length) {
    // Not in the sheet yet: its row is added the first time the button is tapped
    if (!VOLUNTEER_SCRIPT || !game.newRows.length) return "";
    const need = game.newRows.reduce((n, r) => n + Object.values(r.cells).filter(v => !v).length, 0);
    return `<div class="volrow"><button type="button" class="volbtn" data-vol="${esc(key)}">Volunteer · ${need} open</button></div>`;
  }
  const open = volOpen(rows);
  return `<div class="volrow"><button type="button" class="volbtn${open ? "" : " full"}" data-vol="${esc(key)}">${open ? `Volunteer · ${open} open` : "Volunteers ✓ all filled"}</button></div>`;
}
let volName = ""; try { volName = localStorage.getItem(KEY + "-volname") || ""; } catch (e) {}
function openVolForm(key, done) {
  const rows = volRowsFor(key); if (!rows.length) return;
  const r0 = rows[0], dlg = $("volForm");
  const spot = (r, role, i) => {
    const v = r.cells[role];
    if (isNA(v)) return "";
    return v ? `<div class="spot taken"><span>${esc(role)}</span><span class="who">${esc(v)}</span></div>`
      : `<label class="spot"><input type="radio" name="spot" value="${i}|${esc(role)}" required> <span>${esc(role)}</span></label>`;
  };
  const open = volOpen(rows);
  dlg.innerHTML = `<form method="dialog" id="volF">
    <h2 id="volTitle">Volunteer: ${esc(r0.match)}</h2>
    <p class="sub">${esc([r0.day, r0.time, courtLabel(r0.court).replace(/^[A-Za-z ]+\s(\d+)$/, "Court $1")].filter(Boolean).join(" · "))}</p>
    ${done ? `<p class="ok">${esc(done)}</p>` : ""}
    ${rows.map((r, i) => `<h3>${esc(r.team)} · ${/home/i.test(r.side) ? "home team" : /away|visit/i.test(r.side) ? "visiting team" : esc(r.side)} vs ${esc(r.opp)}</h3>
      ${vol.roles.map(role => spot(r, role, i)).join("")}`).join("")}
    ${open && VOLUNTEER_SCRIPT ? `<label class="name" for="volNameIn">Your name</label>
      <input type="text" id="volNameIn" autocomplete="name" maxlength="60" required value="${esc(volName)}" placeholder="First and last name">` : ""}
    ${open && !VOLUNTEER_SCRIPT ? `<p class="sub" style="margin-top:12px">Sign-ups from this page aren't switched on yet. <a href="${esc(VOLUNTEER_SHEET)}" target="_blank" rel="noopener">Open the volunteer sheet</a>.</p>` : ""}
    <p class="err" id="volErr" hidden></p>
    <div class="actions">
      <button type="button" class="ghost" id="volCancel">${open && VOLUNTEER_SCRIPT ? "Cancel" : "Close"}</button>
      ${open && VOLUNTEER_SCRIPT ? `<button type="submit" class="refresh" id="volSubmit">Sign up</button>` : ""}
    </div></form>`;
  $("volCancel").addEventListener("click", () => dlg.close());
  const f = $("volF");
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const pick = f.querySelector("input[name=spot]:checked"), name = $("volNameIn").value.trim();
    const err = m => { $("volErr").textContent = m; $("volErr").hidden = false; };
    if (!pick) return err("Pick a job.");
    if (!name) return err("Add your name.");
    const [i, role] = [+pick.value.split("|")[0], pick.value.slice(pick.value.indexOf("|") + 1)];
    const r = rows[i];
    $("volSubmit").disabled = true; $("volSubmit").textContent = "Signing up…";
    try {
      // text/plain keeps it a simple request, which Apps Script answers without a CORS preflight
      const res = await fetch(VOLUNTEER_SCRIPT, { method: "POST", body: JSON.stringify({ match: r.match, team: r.team, role, name }) });
      const out = await res.json();
      volName = name; try { localStorage.setItem(KEY + "-volname", name); } catch (e) {}
      if (out.ok) { r.cells[role] = name; render(); openVolForm(key, `Thank you, ${name}! You're the ${role} for ${r.team}.`); return; }
      if (out.error === "taken" || out.error === "notneeded") { r.cells[role] = out.value || "N/A"; render(); openVolForm(key); return err("Someone just took that spot. Pick another."); }
      err("Couldn't sign you up (" + (out.error || "unknown") + "). Try again, or use the volunteer sheet.");
    } catch (e2) { err("Couldn't reach the sign-up sheet. Check your connection and try again."); }
    $("volSubmit").disabled = false; $("volSubmit").textContent = "Sign up";
  });
  if (!dlg.open) dlg.showModal();
}
// Adds a game's rows to the sheet (the script skips any that are already there), then opens its form
async function volAdd(game, btn) {
  btn.disabled = true; btn.textContent = "Opening…";
  try {
    const res = await fetch(VOLUNTEER_SCRIPT, { method: "POST", body: JSON.stringify({ action: "add", rows: game.newRows }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || "unknown");
    // The script answers with the rows as they are in the sheet now
    (out.rows || game.newRows).forEach(r => {
      if (!vol.rows.some(x => x.key === volNorm(r.match) && x.team === r.team))
        vol.rows.push({ ...r, key: volNorm(r.match), cells: { ...r.cells } });
    });
    render(); openVolForm(game.key);
  } catch (e) {
    render();
    const dlg = $("volForm");
    dlg.innerHTML = `<form method="dialog"><h2 id="volTitle">Couldn't open sign-up</h2>
      <p class="sub">${/name|role/.test(e.message) ? "The volunteer sheet's script needs updating to add new games (see volunteer-script.gs)." : "Couldn't reach the volunteer sheet. Check your connection and try again."}</p>
      <div class="actions"><button type="submit" class="ghost">Close</button></div></form>`;
    if (!dlg.open) dlg.showModal();
  }
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-vol]"); if (!b) return;
  const key = b.dataset.vol, game = volGames.get(key);
  if (!volRowsFor(key).length && game && game.newRows.length) return volAdd(game, b);
  openVolForm(key); loadVolunteers(false);
});

/* ---------------- rendering ---------------- */
// Courts read "Court 7", whatever the venue name before the number ("New Century FH #7", "Sports Pavilion #3")
const courtLabel = c => String(c || "").trim().replace(/^.*?#\s*(\d+)\s*$/, "Court $1").replace(/^Sports Pavilion\s*/i, "Court ");
const esc = v => String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const signed = n => n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "0";

function renderDivisions() {
  const cur = current().id;
  const stage = currentStage();
  document.querySelectorAll("#stages button").forEach(b => b.setAttribute("aria-pressed", b.dataset.stage === stage));
  const btn = d => `<button type="button" data-div="${esc(d.id)}" aria-pressed="${!setup && d.id === cur}">${esc(d.name)}</button>`;
  const f = filtersFor(stage);
  const active = stageFilters(stage);
  $("filters").innerHTML = active.map(x => {
    const opts = filterOptions(stage, x.key);
    return `<label><span class="sr">${esc(x.label)}</span><select data-filter="${x.key}" class="${f[x.key] ? "set" : ""}" title="${esc(x.label)}"><option value="">${esc(x.any)}</option>${
      opts.map(v => `<option ${v === f[x.key] ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></label>`;
  }).join("") + (active.some(x => f[x.key]) ? `<button type="button" class="linkish" id="clearFilters">Clear</button>` : "");
  const list = visibleDivisions(stage);
  $("divs").innerHTML = list.map(btn).join("");
  $("divs").hidden = !list.length;
}

const notices = () => { baseDivisions(); return [configWarning, mergeWarning].filter(Boolean).map(w => `<div class="msg err"><p>${esc(w)}</p></div>`).join(""); };
function render() {
  const d = current(), s = slot(d.id);
  document.title = (SITE_LABEL ? SITE_LABEL + " · " : "") + d.name + (d.type === "brackets" ? " brackets" : " pools"); $("title").textContent = d.name;
  $("siteLabel").hidden = !SITE_LABEL; $("siteLabel").textContent = SITE_LABEL;
  $("eventLine").textContent = eventName() + (d.type === "brackets" ? " bracket play" : " pool play");
  renderDivisions(); updateStatus(); busy(s.busy);
  if (setup) { $("bar").hidden = true; return renderSetup(); }
  if (currentStage() === "club") return renderClub();
  if (d.id === "__none") {
    $("bar").hidden = true; $("status").textContent = "";
    $("eventLine").textContent = eventName();
    $("main").innerHTML = notices() + `<div class="msg"><h2>No divisions match these filters</h2><p>Try a different combination, or clear the filters.</p>
      <p><button class="ghost" type="button" id="clearFilters2">Clear filters</button></p></div>`;
    $("clearFilters2").addEventListener("click", clearFilters);
    return;
  }

  let html = notices();
  if (s.error) {
    const inPreview = location.protocol === "blob:" || /claude|anthropic/.test(location.hostname);
    html += `<div class="msg err"><h2>${s.error === "nopools" ? `Couldn't find any ${d.type === "brackets" ? "brackets" : "pools"} on that tab` : "Couldn't reach the sheet"}</h2>
      <p>${s.error === "nopools"
        ? `Make sure the link points at a ${d.type === "brackets" ? "bracket" : "pool play"} tab (it should end in #gid= followed by that tab's number).`
        : "Check your connection and that the sheet is still shared as “Anyone with the link can view.”"}
      ${s.model ? " Showing the last results that loaded." : ""}</p>
      ${inPreview ? "<p>This preview window blocks outside connections. Download the file and open it in your browser.</p>" : ""}
      ${s.errorDetail ? `<p style="color:var(--muted);font-size:14px">Details: ${esc(s.errorDetail)}</p>` : ""}</div>`;
  }
  const model = s.model;
  if (!model) { $("bar").hidden = true; $("main").innerHTML = html; return; }

  $("bar").hidden = false;
  // The tournament's own tab, for anything this page doesn't show
  const sheet = /^https:\/\/docs\.google\.com\//.test(d.url) ? `<a class="sheetlink" href="${esc(d.url)}" target="_blank" rel="noopener">Open sheet ↗</a>` : "";
  if (model.kind === "brackets") return renderBrackets(s, html, sheet);
  $("pools").innerHTML = model.pools.map(p =>
    `<button type="button" data-pool="${esc(p.letter)}" aria-pressed="${p.letter === s.active}" class="${p.complete ? "done" : ""}" aria-label="${esc(p.name)}${p.complete ? ", final" : ""}">${esc(p.letter)}</button>`).join("");
  const allTeams = model.pools.flatMap(p => p.teams.map(t => t.team)).sort((a, b) => a.localeCompare(b));
  $("followSel").innerHTML = `<option value="">Follow a team…</option>` + allTeams.map(t => `<option ${t === settings.follow ? "selected" : ""}>${esc(t)}</option>`).join("");

  const p = model.pools.find(x => x.letter === s.active) || model.pools[0];
  const fl = k => flashKeys.has(`${p.letter}|${k}`) ? " flash" : "";
  const mine = t => settings.follow && t === settings.follow ? " mine" : "";
  const courts = [...new Set(p.matches.map(m => courtLabel(m.court)).filter(Boolean))];
  const badge = p.state === "final" ? `<span class="badge final">Final</span>` : p.state === "live" ? `<span class="badge live">In progress</span>` : `<span class="badge">Not started</span>`;

  let standings;
  if (p.complete && p.results.length) {
    const byTeam = Object.fromEntries(p.teams.map(t => [t.team, t]));
    standings = p.results.map((r, i) => ({ ...(byTeam[r.team] || { w: 0, l: 0, diff: 0 }), team: r.team, place: i + 1, adv: r.adv }));
  } else {
    standings = [...p.teams].sort((a, b) => b.pct - a.pct || b.diff - a.diff || a.seed - b.seed).map((t, i) => ({ ...t, place: i + 1 }));
  }
  const table = `<table><thead><tr><th></th><th>Team</th><th class="n">Sets</th><th class="n">Points</th></tr></thead><tbody>${
    standings.map(t => `<tr class="${mine(t.team).trim()}"><td class="rank">${t.place}</td>
      <td class="${fl("t" + t.team).trim()}"><span class="team">${esc(t.team)}</span>${t.adv ? `<span class="adv">Advances to ${esc(t.adv)}</span>` : ""}</td>
      <td class="n${fl("t" + t.team)}">${t.w}–${t.l}</td><td class="n${fl("t" + t.team)}">${signed(t.diff)}</td></tr>`).join("")
  }</tbody></table>`;
  let standNote = p.complete ? "Final order and advancement from the tournament sheet."
    : "Unofficial order by sets won, then point difference. Final placement comes from the tournament once the pool is complete.";
  if (p.resultsNote) standNote += " " + p.resultsNote;

  const estimates = estimateStarts(p.matches);
  const matches = p.matches.map((m, i) => {
    const aw = m.sets.filter(([x, y]) => x > y).length, bw = m.sets.length - aw;
    const res = !m.played ? ["none", "none"] : aw > bw ? ["won", "lost"] : bw > aw ? ["lost", "won"] : ["none", "none"];
    const setCells = side => m.sets.map(([x, y]) => { const me = side ? y : x, them = side ? x : y; return `<span class="${me > them ? "w" : ""}">${me}</span>`; }).join("");
    const when = estimates[i] != null ? `<span title="Follows previous match; estimated at ${MATCH_MINUTES} minutes a match">Est. ${clock(estimates[i])}</span>`
      : /rolling/i.test(m.time) ? "Follows previous match" : esc(m.time);
    // Every match shows its day ("Fri", "Sat"), since some pools play over two days
    const dk = String(m.day || "").slice(0, 3).toLowerCase();
    const day = /^(mon|tue|wed|thu|fri|sat|sun)$/.test(dk) ? `<b class="mday">${dk[0].toUpperCase() + dk.slice(1)}</b> ` : "";
    // Every match shows its court, even when the whole pool plays on one
    const where = m.court ? `, ${esc(courtLabel(m.court))}` : "";
    const tag = m.played ? (aw === bw ? `<span class="tag final">Split ${aw}–${bw}</span>` : `<span class="tag final">Final</span>`)
              : m.next ? `<span class="tag next">Up next</span>` : "";
    return `<li class="${(mine(m.a) || mine(m.b)).trim()}${fl("m" + m.num)}">
      <div class="mhead"><span>Match ${esc(m.num)}: ${day}${when}${where}</span>${tag}</div>
      <div class="side ${res[0]}"><span class="nm">${m.a ? esc(m.a) : `<em style="color:var(--muted);font-weight:400">To be decided</em>`}</span><span class="sets">${setCells(0)}</span></div>
      <div class="side ${res[1]}"><span class="nm">${m.b ? esc(m.b) : `<em style="color:var(--muted);font-weight:400">To be decided</em>`}</span><span class="sets">${setCells(1)}</span></div>${volButton(volGame(d, { match: volPoolMatch(d, p.name, m.num), a: m.a, b: m.b, day: m.day, court: m.court,
        time: estimates[i] != null ? `${clock(estimates[i])} (est.)` : m.time }))}</li>`;
  }).join("");

  html += `<div class="pool-head"><h2>${esc(p.name)}</h2>${badge}<span class="where">${esc(courts.join(" and "))}</span>${sheet}</div>
    <div class="grid">
      <section class="card"><h3>Standings</h3>${table}<p class="note">${esc(standNote)}</p></section>
      <section class="card"><h3>Matches</h3><ol class="matches">${matches}</ol></section>
    </div>
`;
  $("main").innerHTML = html;
  flashKeys = new Set();
}

function renderBrackets(s, html, sheet) {
  const model = s.model, d = current();
  const list = model.brackets.filter(g => g.matches.length);
  $("pools").innerHTML = list.map(g =>
    `<button type="button" data-pool="${esc(g.key)}" aria-pressed="${g.key === s.active}" class="${g.state === "final" ? "done" : ""}" aria-label="${esc(g.title)}${g.state === "final" ? ", final" : ""}">${esc(g.label)}</button>`).join("");
  const allTeams = [...new Set(list.flatMap(g => g.teams))].sort((a, b) => a.localeCompare(b));
  $("followSel").innerHTML = `<option value="">Follow a team…</option>` + allTeams.map(t => `<option ${t === settings.follow ? "selected" : ""}>${esc(t)}</option>`).join("");

  const g = list.find(x => x.key === s.active) || list[0];
  const mine = t => settings.follow && t === settings.follow;
  const badge = g.state === "final" ? `<span class="badge final">Final</span>` : g.state === "live" ? `<span class="badge live">In progress</span>` : `<span class="badge">Not started</span>`;
  const courtName = c => esc(courtLabel(c));

  const matchCard = (m, i, roundName) => {
    const sideHtml = (side) => {
      const t = m[side];
      const won = m.winner === side, lost = m.winner && !won;
      const sets = m.sets.map(([w, l]) => won ? `<span class="w">${w}</span>` : `<span>${l}</span>`).join("");
      if (!t) return `<div class="side none tbd"><span class="nm"><span class="seed"></span>To be decided</span><span class="sets"></span></div>`;
      const seed = /^\d+$/.test(t.seed) ? "#" + t.seed : t.seed;
      return `<div class="side ${won ? "won" : lost ? "lost" : "none"}${mine(t.team) ? " mine" : ""}"><span class="nm"><span class="seed">${esc(seed)}</span>${esc(t.team)}</span><span class="sets">${m.winner ? sets : ""}</span></div>`;
    };
    const when = [m.day, m.time].filter(Boolean).join(" ");
    const tag = m.winner ? `<span class="tag final">Final</span>` : m.next ? `<span class="tag next">Up next</span>` : "";
    const loser = m.winner ? m[m.winner === "top" ? "bottom" : "top"] : null;
    const foot = [m.forfeit ? `${esc(m.forfeit)} didn't show (forfeit)` : "", m.format, m.loserTo ? (loser ? `${esc(loser.team)} moves to ${esc(m.loserTo)}` : `Loser moves to ${esc(m.loserTo)}`) : ""].filter(Boolean).join(". ");
    const flash = flashKeys.has(`${g.key}|m${m.r}-${m.c}`) ? " flash" : "";
    const followed = (m.top && mine(m.top.team)) || (m.bottom && mine(m.bottom.team)) ? " mine" : "";
    return `<div class="bmatch${flash}${followed}">
      <div class="mhead"><span>${esc(when)}${m.court ? ", " + courtName(m.court) : ""}</span>${tag}</div>
      ${sideHtml("top")}${sideHtml("bottom")}
      ${foot ? `<div class="foot">${foot}</div>` : ""}${volButton(volGame(d, { match: volBracketMatch(d, model, m), a: m.top && m.top.team, b: m.bottom && m.bottom.team,
        day: m.day, court: m.court, time: String(m.time || "").toUpperCase() }))}</div>`;
  };

  const rounds = g.rounds.map(rd => `<div class="round"><h3>${esc(rd.name)}</h3><div class="slots">${
    rd.matches.map((m, i) => matchCard(m, i, rd.name)).join("")}</div></div>`).join("");
  // 3rd place and the consolation side, below the bracket
  const extra = (g.extra || []).map(rd => `<div class="round"><h3>${esc(rd.name)}</h3><div class="slots">${
    rd.matches.map((m, i) => matchCard(m, i, rd.name)).join("")}</div></div>`).join("");

  const champ = g.champion ? `<div class="champ"><span class="lbl">Champion</span><span class="who">${esc(g.champion)}</span>${g.award ? `<span class="award">Wins ${esc(g.award)}</span>` : ""}</div>` : "";

  // Silver and Bronze tabs have no results table, so theirs is built from the matches and has no "Next" column
  const hasNext = g.results.some(r => r.adv);
  const results = g.results.length ? `<section class="card"><h3>Results</h3><table><thead><tr><th></th><th>Team</th>${hasNext ? "<th>Next</th>" : ""}</tr></thead><tbody>${
    g.results.map((r, i) => `<tr class="${mine(r.team) ? "mine" : ""}"><td class="rank">${esc(r.rank || i + 1)}</td><td><span class="team">${esc(r.team)}</span></td>${hasNext ? `<td>${esc(r.adv)}</td>` : ""}</tr>`).join("")
  }</tbody></table><p class="note">${hasNext ? "Final placement and where each team plays next, from the tournament sheet." : "Final placement from the match results."}</p></section>` : "";

  html += `<div class="pool-head"><h2>${esc(g.title)}</h2>${badge}${sheet}</div>
    ${champ}
    <div class="bracket" style="--rounds:${g.rounds.length}">${rounds}</div>
    ${extra ? `<h2 class="subhead">Placement matches</h2><div class="bracket placements">${extra}</div>` : ""}
    ${results}
`;
  $("main").innerHTML = html;
  flashKeys = new Set();
}

function renderListStatus() {
  const box = $("listStatus"); if (!box) return;
  const when = t => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const wait = Math.ceil(backoffLeft() / 60e3);
  const fromSheet = configDivs && configDivs.divs.length;
  const f = discovered.failed || [];
  let body = `<p>${fromSheet ? `The division list comes from your divisions sheet (${baseDivisions().length} divisions).`
      : "Your divisions sheet couldn't be read or is empty, so the saved list is showing."}
    To fill the sheet from the NCHVC index, copy the rows below and paste them into cell A1 of the sheet, replacing what's there.
    Rows already in the sheet keep their name and Show; tabs the viewer can't read yet come in with Show = No.</p>
    <p><textarea id="sheetRows" readonly rows="8" style="width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;white-space:pre;overflow:auto">${esc(sheetRows(discovered))}</textarea></p>
    <p class="row"><button class="refresh" type="button" id="copyRows">Copy rows</button>
      ${API_KEY ? (discovery ? `<span><strong>Reading the index…</strong> ${discovery.total ? `checked ${discovery.done} of ${discovery.total} tabs` : ""}</span>`
        : `<button class="ghost" type="button" id="updateList" ${wait ? "disabled" : ""}>Build rows from the NCHVC index</button>`) : ""}</p>
    <p style="color:var(--muted);font-size:14px">${discovered === SAVED_LIST ? `These rows come from the saved index discovery (${esc(when(discovered.at))}).` : `Rebuilt from the NCHVC index ${esc(when(discovered.at))}.`}
      ${API_KEY ? "Rebuilding uses the Google Sheets API (17 reads) and is only needed if the index changes, such as next year." : ""}
      ${wait ? ` Google asked us to slow down, so rebuilding is paused for about ${wait} minute${wait === 1 ? "" : "s"}.` : ""}</p>
    ${discoveryError && !discovery ? `<p style="color:var(--bad)">Rebuilding failed: ${esc(discoveryError)}</p>` : ""}
    ${f.length ? `<details><summary>${f.length} tab${f.length === 1 ? "" : "s"} couldn't be read (their layout isn't supported yet)</summary><ul>${
      f.map(x => `<li>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>` : esc(x.name)}${x.tab ? ` (${esc(x.book)}, tab “${esc(x.tab)}”)` : ""}: ${esc(x.reason)}</li>`).join("")}</ul></details>` : ""}`;
  box.innerHTML = `<h2>Division list</h2>${body}`;
  const b = $("updateList"); if (b) b.addEventListener("click", updateDivisionList);
  $("copyRows").addEventListener("click", async e => {
    const t = $("sheetRows"); t.select();
    try { await navigator.clipboard.writeText(t.value); } catch (err) { document.execCommand("copy"); }
    e.target.textContent = "Copied";
  });
}

function renderSetup() {
  const custom = settings.custom || [];
  $("main").innerHTML = `
    <div class="msg" id="listStatus"></div>
    <div class="msg"><h2>Add a division</h2>
      <p>Divisions added here are saved only on this device. To add one for everyone, add a row to the divisions sheet instead.</p>
      <p>Open that division's pool or bracket tab in Google Sheets and copy the link from the address bar. It should include <strong>#gid=</strong> so the viewer reads the right tab.</p></div>
    <form class="setup" id="setupForm">
      <label>Division name<input name="name" required placeholder="Boys 18U"></label>
      <label>What's on this tab
        <select name="type" style="font:16px Barlow,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)">
          <option value="pools" ${currentStage() === "pools" ? "selected" : ""}>Pool play</option><option value="brackets" ${currentStage() === "brackets" ? "selected" : ""}>Bracket play</option></select></label>
      <label>Google Sheet link<input name="url" required placeholder="https://docs.google.com/spreadsheets/d/…#gid=…"></label>
      <div class="row">
        <button class="refresh" type="submit">Add division</button>
        <button class="ghost" type="button" id="cancelBtn">Cancel</button>
      </div>
      ${custom.length ? `<div><p style="font-weight:600;margin:8px 0">Divisions you've added</p><ul class="custom-list">${
        custom.map(c => `<li><span>${esc(c.name)}</span><button class="ghost" type="button" data-remove="${esc(c.id)}">Remove</button></li>`).join("")}</ul></div>` : ""}
    </form>`;
  renderListStatus();
  $("setupForm").addEventListener("submit", e => {
    e.preventDefault();
    const f = new FormData(e.target);
    if (!linkParts(f.get("url"))) { alert("That doesn't look like a Google Sheets link."); return; }
    const div = { id: "c" + Date.now(), type: f.get("type") || "pools", name: f.get("name").trim(), url: f.get("url").trim() };
    settings.custom = [...custom, div]; settings.division = div.id; settings.stage = div.type; save();
    leaveSetup(); render(); refresh();
  });
  $("cancelBtn").addEventListener("click", () => { leaveSetup(); render(); });
  $("main").querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => {
    settings.custom = custom.filter(c => c.id !== b.dataset.remove);
    if (!divisions().some(d => d.id === settings.division)) settings.division = DIVISIONS[0].id;
    save(); renderSetup(); renderDivisions();
  }));
}

/* ---------------- wiring ---------------- */
$("refreshBtn").addEventListener("click", async () => { await loadConfig(); render(); loadVolunteers(true); if (currentStage() === "club") loadClub(true); else refresh(); });
$("stages").addEventListener("click", e => {
  const b = e.target.closest("button[data-stage]"); if (!b || b.dataset.stage === currentStage() && !setup) return;
  settings.lastByStage = { ...(settings.lastByStage || {}), [currentStage()]: current().id };
  settings.stage = b.dataset.stage;
  const remembered = (settings.lastByStage || {})[settings.stage];
  const options = visibleDivisions(settings.stage);
  settings.division = (options.find(d => d.id === remembered) || options[0] || {}).id;
  leaveSetup(); flashKeys = new Set(); save(); render();
  if (settings.stage === "club") return loadClub(false);
  const s = slot(current().id);
  if (!s.lastUpdated || Date.now() - s.lastUpdated > 30000) refresh();
});
/* Filtering can switch to another division by itself (the only one left). Clearing the
   filters goes back to the division last chosen by tapping it on this stage, or to the
   first one, rather than staying on the one the filters happened to leave. */
function clearFilters() {
  const stage = currentStage(), picked = (settings.chosen || {})[stage];
  settings.sharedFilters = {};
  const list = visibleDivisions(stage);
  settings.division = (list.find(d => d.id === picked) || list[0] || {}).id;
  save(); afterFilterChange();
}
function afterFilterChange() {
  flashKeys = new Set(); render();
  const d = current(); if (d.id === "__none") return;
  settings.division = d.id; save();
  const s = slot(d.id);
  if (!s.lastUpdated || Date.now() - s.lastUpdated > 30000) refresh();
}
$("filters").addEventListener("change", e => {
  const sel = e.target.closest("select[data-filter]"); if (!sel) return;
  settings.sharedFilters = { ...allFilters(), [sel.dataset.filter]: sel.value };
  save(); afterFilterChange();
});
$("filters").addEventListener("click", e => { if (e.target.closest("#clearFilters")) clearFilters(); });
$("divs").addEventListener("click", e => {
  const b = e.target.closest("button[data-div]"); if (!b) return;
  leaveSetup(); settings.division = b.dataset.div; flashKeys = new Set();
  settings.chosen = { ...(settings.chosen || {}), [currentStage()]: b.dataset.div }; save();
  render();
  const s = slot(settings.division);
  if (!s.lastUpdated || Date.now() - s.lastUpdated > 30000) refresh();
});
$("pools").addEventListener("click", e => { const b = e.target.closest("button[data-pool]"); if (b) { slot(current().id).active = b.dataset.pool; render(); } });
$("followSel").addEventListener("change", e => {
  settings.follow = e.target.value; save();
  const s = slot(current().id);
  if (s.model && s.model.kind === "brackets") {
    const g = s.model.brackets.find(x => x.teams.includes(settings.follow));
    if (g) s.active = g.key;
  } else {
    const p = s.model && s.model.pools.find(x => x.teams.some(t => t.team === settings.follow));
    if (p) s.active = p.letter;
  }
  render();
});
setInterval(updateStatus, 30000);
if (VOLUNTEER_SHEET) { $("volunteerLink").href = VOLUNTEER_SHEET; $("volunteerLink").hidden = false; }
if ("auto" in settings) { delete settings.auto; save(); }   // auto-refresh was removed; forget the old setting

/* ---------------- Add to Home Screen ----------------
   iPhones can't be asked to install a page, so they get the steps (Share, then Add to Home Screen).
   Chrome on Android offers an install prompt (beforeinstallprompt), used by the Install button;
   other Android browsers get the menu steps. Shown once on a phone's first visit, then from the
   "Add to Home Screen" button at the end of the page. Hidden when already opened from the icon. */
const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/.test(UA);
const IN_APP = /FBAN|FBAV|Instagram|Snapchat|Line\//.test(UA);   // in-app browsers can't add to the Home Screen
const standalone = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const SHARE_ICON = `<svg width="17" height="19" viewBox="0 0 17 19" fill="none" stroke="#141416" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M8.5 12V1.5M5 4.8l3.5-3.3L12 4.8"/><path d="M5.5 7.5H3a1.5 1.5 0 0 0-1.5 1.5v7.5A1.5 1.5 0 0 0 3 18h11a1.5 1.5 0 0 0 1.5-1.5V9A1.5 1.5 0 0 0 14 7.5h-2.5"/></svg>`;
let installEvent = null;
if (SITE_LABEL) { const t = document.querySelector('meta[name="apple-mobile-web-app-title"]'); t.content = SITE_LABEL + " " + t.content; }
function installHow() {
  if (IS_IOS) return IN_APP
    ? "Open this page in Safari first (this app's <b>•••</b> menu, then <b>Open in browser</b>). Then tap Share and <b>Add to Home Screen</b>."
    : `Tap the Share button ${SHARE_ICON} (on newer iPhones it's in the <b>•••</b> menu), then <b>Add to Home Screen</b>. You may need to tap <b>View More</b> to see it.`;
  if (installEvent) return "It opens full screen from its own icon, like an app.";
  return "Open your browser's menu <b>⋮</b> and tap <b>Add to Home screen</b> or <b>Install app</b>.";
}
function showInstall() { $("installHow").innerHTML = installHow(); $("installGo").hidden = !installEvent; $("installClose").textContent = installEvent ? "Not now" : "Got it"; $("install").hidden = false; }
function hideInstall() { $("install").hidden = true; try { localStorage.setItem(KEY + "-install-seen", "1"); } catch (e) {} }
const updateInstallBtn = () => { $("installBtn").hidden = standalone() || !(IS_IOS || IS_ANDROID || installEvent); };
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); installEvent = e; updateInstallBtn();
  if (!$("install").hidden) showInstall();
});
window.addEventListener("appinstalled", () => { installEvent = null; hideInstall(); updateInstallBtn(); });
$("installBtn").addEventListener("click", showInstall);
$("installClose").addEventListener("click", hideInstall);
$("installGo").addEventListener("click", async () => {
  if (!installEvent) return;
  installEvent.prompt();
  try { await installEvent.userChoice; } catch (e) {}
  installEvent = null; hideInstall(); updateInstallBtn();
});
updateInstallBtn();
let installSeen = false; try { installSeen = !!localStorage.getItem(KEY + "-install-seen"); } catch (e) {}
if ((IS_IOS || IS_ANDROID) && !standalone() && !installSeen) setTimeout(showInstall, 1500);
restoreTabs();
render();
(async () => {
  // With the divisions list saved from last time, the tabs load while the divisions sheet is read
  const config = loadConfig();
  if (!configDivs) await config;
  loadVolunteers(true);
  const load = () => currentStage() === "club" ? loadClub(false) : refresh();
  const first = load();
  await config;
  restoreTabs(); render();
  // A division added to the sheet since last time is loaded once the first pass is done
  await first;
  if (divisions().some(d => !slot(d.id).model && !slot(d.id).error)) load();
})();
</script>
</body>
</html>
