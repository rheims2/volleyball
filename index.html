<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NCHVC pool results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #13294B;
    --navy-2: #1F3A66;
    --gold: #F5B700;
    --paper: #F3F5F9;
    --card: #FFFFFF;
    --line: #DCE1EA;
    --ink: #13294B;
    --muted: #5B6883;
    --win: #1E7F4F;
    --flash: #FFE9A8;
    --bad: #B3261E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Barlow, "Segoe UI", system-ui, sans-serif; background: var(--paper); color: var(--ink); font-size: 16px; }
  .cond { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; }

  header { background: var(--navy); color: #fff; padding: calc(18px + env(safe-area-inset-top, 0px)) clamp(14px, 4vw, 36px) 16px; }
  .top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; max-width: 1100px; margin: 0 auto; }
  h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: clamp(30px, 7vw, 48px); line-height: .95; margin: 0; }
  .status { color: #B8C3D9; font-size: 15px; margin-top: 8px; }
  .status .stale { color: var(--gold); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .refresh {
    font: 700 17px Barlow, sans-serif; background: var(--gold); color: var(--navy); border: 0; border-radius: 999px;
    padding: 11px 22px; cursor: pointer; display: inline-flex; gap: 10px; align-items: center;
  }
  .refresh[disabled] { opacity: .75; cursor: progress; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--navy); border-right-color: transparent; border-radius: 50%; display: none; }
  .loading .spin { display: inline-block; animation: turn .8s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .auto { font-size: 15px; color: #D5DCEA; display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .auto input { accent-color: var(--gold); width: 18px; height: 18px; }
  .linkish { background: none; border: 0; color: #B8C3D9; font: 500 15px Barlow, sans-serif; text-decoration: underline; cursor: pointer; padding: 4px; }

  .event { color: #B8C3D9; font-size: 15px; margin-bottom: 4px; }
  .divs { max-width: 1100px; margin: 16px auto 0; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .divs button { font: 600 16px Barlow, sans-serif; white-space: nowrap; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; cursor: pointer; }
  .divs button[aria-pressed="true"] { background: #fff; color: var(--navy); border-color: #fff; }
  .divs .add { border-style: dashed; color: #B8C3D9; }
  .custom-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .custom-list li { display: flex; justify-content: space-between; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .filterbar { max-width: 1100px; margin: 18px auto 0; display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: flex-end; }
  .stages { display: inline-flex; background: rgba(255,255,255,.1); border-radius: 12px; padding: 4px; gap: 4px; }
  .stages button { font: 700 20px "Barlow Condensed", sans-serif; padding: 8px 20px; border-radius: 9px; border: 0; background: transparent; color: #D5DCEA; cursor: pointer; }
  .stages button[aria-pressed="true"] { background: var(--gold); color: var(--navy); }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
  .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #B8C3D9; }
  .filters select { font: 500 15px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; border: 0; min-width: 118px; background: #fff; color: var(--ink); }
  .filters .linkish { padding: 8px 4px; }
  .divgroup { display: flex; gap: 8px; align-items: center; }
  .divgroup + .divgroup { margin-left: 10px; padding-left: 14px; border-left: 1px solid rgba(255,255,255,.2); }
  .divlabel { color: #B8C3D9; font-size: 14px; white-space: nowrap; }
  .champ { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; background: var(--navy); color: #fff; border-radius: 14px; padding: 14px 18px; margin-bottom: 18px; }
  .champ .lbl { color: var(--gold); font-weight: 700; font-size: 15px; }
  .champ .who { font: 700 26px/1.1 "Barlow Condensed", sans-serif; }
  .champ .award { color: #B8C3D9; font-size: 15px; }
  .bracket { display: grid; grid-template-columns: repeat(var(--rounds), minmax(0, 1fr)); gap: 18px; margin-bottom: 22px; }
  .round { display: flex; flex-direction: column; gap: 14px; }
  .bracket.placements { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .subhead { font: 700 26px/1 "Barlow Condensed", sans-serif; margin: 4px 0 14px; }
  .round h3 { font: 700 20px "Barlow Condensed", sans-serif; margin: 0; }
  .round .slots { display: flex; flex-direction: column; justify-content: space-around; gap: 14px; flex: 1; }
  .bmatch { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .bmatch .seed { color: var(--muted); font-size: 13px; font-weight: 500; min-width: 38px; white-space: nowrap; }
  .bmatch .tbd .nm { color: var(--muted); font-style: italic; font-weight: 400; }
  .bmatch .foot { color: var(--muted); font-size: 14px; margin-top: 8px; }
  @media (max-width: 700px) { .bracket { grid-template-columns: 1fr; } .round .slots { justify-content: flex-start; } }
  .bar { background: var(--navy-2); padding: 10px clamp(14px, 4vw, 36px); position: sticky; top: 0; z-index: 2; }
  .bar-inner { max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
  .pools { display: flex; gap: 6px; overflow-x: auto; }
  .pools button {
    font: 700 20px "Barlow Condensed", sans-serif; min-width: 46px; height: 44px; padding: 0 12px;
    border-radius: 10px; border: 2px solid transparent; background: rgba(255,255,255,.08); color: #fff; cursor: pointer;
  }
  .pools button[aria-pressed="true"] { background: #fff; color: var(--navy); }
  .pools button.done::after { content: "✓"; font-size: 14px; margin-left: 4px; color: var(--win); }
  .pools button[aria-pressed="false"].done::after { color: #8FD3B0; }
  .follow { display: flex; gap: 8px; align-items: center; color: #D5DCEA; font-size: 15px; }
  .follow select { font: 500 15px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; border: 0; max-width: 230px; background: #fff; color: var(--ink); }

  main { max-width: 1100px; margin: 0 auto; padding: 22px clamp(14px, 4vw, 36px) calc(40px + env(safe-area-inset-bottom, 0px)); }
  .pool-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 16px; }
  .pool-head h2 { font: 700 34px/1 "Barlow Condensed", sans-serif; margin: 0; }
  .pool-head .where { color: var(--muted); font-size: 16px; }
  .badge { font: 700 14px Barlow, sans-serif; padding: 3px 10px; border-radius: 999px; background: var(--line); color: var(--ink); }
  .badge.final { background: var(--win); color: #fff; }
  .badge.live { background: var(--gold); color: var(--navy); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 22px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  section.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  section.card h3 { font: 700 21px "Barlow Condensed", sans-serif; margin: 0; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .note { color: var(--muted); font-size: 14px; padding: 10px 16px 14px; margin: 0; }

  table { border-collapse: collapse; width: 100%; }
  th { font: 600 14px Barlow, sans-serif; color: var(--muted); text-align: left; padding: 10px 12px; white-space: nowrap; }
  td { padding: 12px; border-top: 1px solid var(--line); vertical-align: top; }
  td.rank { font: 700 22px/1 "Barlow Condensed", sans-serif; width: 40px; text-align: center; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.n { font-weight: 600; }
  .team { font-weight: 600; }
  .adv { display: block; font-size: 14px; font-weight: 500; color: var(--win); margin-top: 3px; }

  ol.matches { list-style: none; margin: 0; padding: 0; }
  ol.matches li { padding: 12px 16px 14px; border-top: 1px solid var(--line); }
  ol.matches li:first-child { border-top: 0; }
  .mhead { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .mhead .tag { font-weight: 700; }
  .tag.next { color: var(--navy); background: var(--gold); padding: 1px 8px; border-radius: 999px; }
  .tag.final { color: var(--win); }
  .side { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 3px 0; }
  .side .nm { display: flex; align-items: center; gap: 8px; }
  .side.won .nm { font-weight: 700; }
  .side.won .nm::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--win); flex: none; }
  .side.lost .nm { color: var(--muted); }
  .side.lost .nm::before, .side.none .nm::before { content: ""; width: 8px; height: 8px; flex: none; }
  .sets { display: flex; gap: 6px; font-variant-numeric: tabular-nums; }
  .sets span { min-width: 30px; text-align: center; padding: 2px 4px; border-radius: 6px; font-weight: 600; color: var(--muted); }
  .sets span.w { color: var(--ink); background: #E8F3EC; }

  .mine { box-shadow: inset 4px 0 0 var(--gold); }
  tr.mine td { background: #FFF8E0; }
  .flash { animation: flash 8s ease-out; }
  @keyframes flash { 0%, 35% { background: var(--flash); } 100% { background: transparent; } }

  .msg { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 8px; padding: 14px 18px; margin-bottom: 18px; line-height: 1.5; max-width: 700px; }
  .msg.err { border-left-color: var(--bad); }
  .msg h2 { font: 700 22px "Barlow Condensed", sans-serif; margin: 0 0 4px; }
  .msg p { margin: 4px 0; }
  footer { color: var(--muted); font-size: 14px; margin-top: 24px; line-height: 1.5; }

  form.setup { display: grid; gap: 16px; max-width: 700px; }
  form.setup label { display: grid; gap: 6px; font-weight: 600; }
  form.setup small { font-weight: 400; color: var(--muted); }
  form.setup input { font: 16px Barlow, sans-serif; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .ghost { font: 600 16px Barlow, sans-serif; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 10px 20px; cursor: pointer; }

  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; background: var(--flash); } .loading .spin { animation-duration: 2.5s; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <div class="event" id="eventLine">2025 NCHVC pool play</div>
      <h1 id="title">Pool results</h1>
      <div class="status" id="status" aria-live="polite">Loading results…</div>
    </div>
    <div class="controls">
      <button class="refresh" id="refreshBtn" type="button"><span class="spin" aria-hidden="true"></span><span id="refreshLabel">Refresh results</span></button>
      <label class="auto"><input type="checkbox" id="autoChk"> Auto-refresh every minute</label>
    </div>
  </div>
  <div class="filterbar">
    <div class="filters" id="filters" aria-label="Filters"></div>
    <div class="stages" id="stages" role="group" aria-label="Tournament stage">
      <button type="button" data-stage="pools">Pool play</button>
      <button type="button" data-stage="brackets">Bracket play</button>
    </div>
  </div>
  <div class="divs" id="divs" aria-label="Divisions"></div>
</header>
<div class="bar" id="bar" hidden>
  <div class="bar-inner">
    <div class="pools" id="pools" aria-label="Pools"></div>
    <label class="follow">Follow a team
      <select id="followSel"><option value="">None</option></select>
    </label>
  </div>
</div>
<main id="main"></main>

<script src="config.js"></script>
<script>
/* ------------------------------------------------------------------
   DIVISIONS SHEET: the link to your Google Sheet that lists the divisions
   is set in config.js, next to this file, so updating index.html never
   overwrites it. The value below is only used if config.js is missing.
------------------------------------------------------------------- */
const VIEWER_CONFIG = window.VIEWER_CONFIG || {};
const CONFIG_SHEET = VIEWER_CONFIG.divisionsSheet || "";
/* Division discovery reads the official "Nationals Bracket Index" through the
   Google Sheets API (the public feeds don't include link addresses). The API key
   lives in config.js as sheetsApiKey. Scores never use the API. */
const API_KEY = VIEWER_CONFIG.sheetsApiKey || "";
const INDEX_SHEET = VIEWER_CONFIG.indexSheet || "https://docs.google.com/spreadsheets/d/1ONzz5XqL-buAxvHXNHfuTRtDayzaM10Cy7KlOdt5GL0/edit?gid=1891963095#gid=1891963095";

/* The division list, saved from the NCHVC bracket index (now the 2026 Regionals one) (tabs checked
   readable by the parsers). Visitors use this list, so they never call the Sheets
   API. "Update division list" on the Add a division page rebuilds it through the
   API in that browser only; to update it for everyone, regenerate this block.
   type is "pools" for pool play tabs or "brackets" for bracket tabs. */
const SAVED_LIST = {
  at: 1790644111502, // 2026-09-29, 2026 Heartland Regionals index
  event: "2026 Heartland NCHVC", books: 7,
  divs: [
    {id: "pools:girls-18u", type: "pools", name: "Girls 18U", url: "https://docs.google.com/spreadsheets/d/1up_uIc0EpxA2QcM3wZ07qGCfnbL6sY4LsicjqM1pwFg/edit#gid=1936931201"},
    {id: "brackets:girls-18u-gold", type: "brackets", name: "Girls 18U Gold", url: "https://docs.google.com/spreadsheets/d/1up_uIc0EpxA2QcM3wZ07qGCfnbL6sY4LsicjqM1pwFg/edit#gid=493450767"},
    {id: "brackets:girls-18u-silver", type: "brackets", name: "Girls 18U Silver", url: "https://docs.google.com/spreadsheets/d/1up_uIc0EpxA2QcM3wZ07qGCfnbL6sY4LsicjqM1pwFg/edit#gid=416973804"},
    {id: "pools:girls-18u-consolation-pool", type: "pools", name: "Girls 18U Consolation Pool", url: "https://docs.google.com/spreadsheets/d/1up_uIc0EpxA2QcM3wZ07qGCfnbL6sY4LsicjqM1pwFg/edit#gid=1511652398"},
    {id: "pools:girls-jv", type: "pools", name: "Girls JV", url: "https://docs.google.com/spreadsheets/d/1hv5NuNFqp7oaYyet6Psjd_2djblKJOoLFnAaIH9qMls/edit#gid=1936931201"},
    {id: "brackets:girls-jv-gold", type: "brackets", name: "Girls JV Gold", url: "https://docs.google.com/spreadsheets/d/1hv5NuNFqp7oaYyet6Psjd_2djblKJOoLFnAaIH9qMls/edit#gid=493450767"},
    {id: "brackets:girls-jv-consolation", type: "brackets", name: "Girls JV Consolation", url: "https://docs.google.com/spreadsheets/d/1hv5NuNFqp7oaYyet6Psjd_2djblKJOoLFnAaIH9qMls/edit#gid=750681530"},
    {id: "pools:girls-16u", type: "pools", name: "Girls 16U", url: "https://docs.google.com/spreadsheets/d/1DK0WJbG4KXt0bEXwZ8JOOItYdlbwYPQQBAvWgS9h_4s/edit#gid=1936931201"},
    {id: "brackets:girls-16u-gold", type: "brackets", name: "Girls 16U Gold", url: "https://docs.google.com/spreadsheets/d/1DK0WJbG4KXt0bEXwZ8JOOItYdlbwYPQQBAvWgS9h_4s/edit#gid=493450767"},
    {id: "pools:girls-14u", type: "pools", name: "Girls 14U", url: "https://docs.google.com/spreadsheets/d/1RfZyKbzSnlUaerlwguhxGXqE1aYFVfEVFXBnZzgRNgA/edit#gid=1936931201"},
    {id: "brackets:girls-14u-gold", type: "brackets", name: "Girls 14U Gold", url: "https://docs.google.com/spreadsheets/d/1RfZyKbzSnlUaerlwguhxGXqE1aYFVfEVFXBnZzgRNgA/edit#gid=493450767"},
    {id: "brackets:girls-14u-silver", type: "brackets", name: "Girls 14U Silver", url: "https://docs.google.com/spreadsheets/d/1RfZyKbzSnlUaerlwguhxGXqE1aYFVfEVFXBnZzgRNgA/edit#gid=416973804"},
    {id: "pools:girls-14u-consolation-pool", type: "pools", name: "Girls 14U Consolation Pool", url: "https://docs.google.com/spreadsheets/d/1RfZyKbzSnlUaerlwguhxGXqE1aYFVfEVFXBnZzgRNgA/edit#gid=1511652398"},
    {id: "pools:girls-12u", type: "pools", name: "Girls 12U", url: "https://docs.google.com/spreadsheets/d/1ltTFtPncALoxNuVVhQstdJmCi7R5gQFtSpNAFRzLdN8/edit#gid=1936931201"},
    {id: "brackets:girls-12u-gold", type: "brackets", name: "Girls 12U Gold", url: "https://docs.google.com/spreadsheets/d/1ltTFtPncALoxNuVVhQstdJmCi7R5gQFtSpNAFRzLdN8/edit#gid=707546107"},
    {id: "pools:boys-18u", type: "pools", name: "Boys 18U", url: "https://docs.google.com/spreadsheets/d/1r85L_BKgq9zl7ISlNY2uB-JMMfBH6T8loH4k4lwvnmE/edit#gid=1936931201"},
    {id: "brackets:boys-18u-gold", type: "brackets", name: "Boys 18U Gold", url: "https://docs.google.com/spreadsheets/d/1r85L_BKgq9zl7ISlNY2uB-JMMfBH6T8loH4k4lwvnmE/edit#gid=416973804"},
    {id: "pools:boys-18u-consolation-pool", type: "pools", name: "Boys 18U Consolation Pool", url: "https://docs.google.com/spreadsheets/d/1r85L_BKgq9zl7ISlNY2uB-JMMfBH6T8loH4k4lwvnmE/edit#gid=1511652398"},
    {id: "pools:boys-16u", type: "pools", name: "Boys 16U", url: "https://docs.google.com/spreadsheets/d/1O5cvGPgUlDi3VAZmgqVNtIrp3xedGdQwjSnQXG8nBgo/edit#gid=1511652398"}
  ],
  failed: [
    {name: "Girls JV FRI Qualifier", tab: "FRI Qualifier", book: "GJV", url: "https://docs.google.com/spreadsheets/d/1hv5NuNFqp7oaYyet6Psjd_2djblKJOoLFnAaIH9qMls/edit#gid=120168667", reason: "no brackets found"}
  ]
};
const DIVISIONS = SAVED_LIST.divs;
const AUTO_SECONDS = 60;
const KEY = "nchvc-pool-viewer-v2";

/* ---------------- parsing (works from labels, not fixed cell addresses) ---------------- */
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.map(r => r.map(v => v.trim()));
}

const num = v => { const s = String(v || "").replace(/,/g, ""); const m = s.match(/^\((\d+(\.\d+)?)\)$/); if (m) return -Number(m[1]); return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : null; };

function parsePools(rows) {
  const at = (r, c) => (rows[r] && rows[r][c]) || "";
  /* Each pool ends with a "Pool A Results" row ("Consolation Pool Results"), so a pool
     runs from just after the previous pool's Results row to its own, and is named by it.
     Schedule headers vary too much to split on ("Pool Schedule", "Pool D Schedule- Play
     3 Sets", "Friday Schedule-" and "Saturday Schedule-" in one pool). Tabs without
     Results rows fall back to the "Pool A Schedule" headers. */
  let starts = [];
  const resultCells = [];
  rows.forEach((row, r) => row.forEach((v, c) => { if (/^.*\bpool\b.*\s+results$/i.test(v)) resultCells.push({ r, v }); }));
  if (resultCells.length) {
    starts = resultCells.map((x, i) => {
      const name = x.v.replace(/\s+results$/i, "").trim();
      // Button label: the pool letter ("Iron Pool A" -> "A"), else the name ("Consolation Pool" -> "Consolation")
      const letter = (name.match(/\bpool\s+(.+)$/i) || [])[1] || name.replace(/\s*pool$/i, "") || name;
      return { r: i ? resultCells[i - 1].r : -1, resRow: x.r, end: i + 1 < resultCells.length ? resultCells[i + 1].r : rows.length, letter, name };
    });
  } else {
    rows.forEach((row, r) => row.forEach((v, c) => {
      const m = v.match(/^Pool\s+(.+?)\s+Schedule$/i);
      if (m) starts.push({ r, letter: m[1], name: "Pool " + m[1] });
    }));
    starts.forEach((st, i) => { st.end = i + 1 < starts.length ? starts[i + 1].r : rows.length; });
  }
  const note = (rows.flat().find(v => /^text scores/i.test(v)) || "");

  const pools = starts.map((st, i) => {
    const end = st.end;
    const pool = { letter: st.letter, name: st.name, matches: [], teams: [], results: [], complete: false, grid: {}, slots: 0 };
    let seed = null, resRow = null;
    if (st.resRow != null) { resRow = st.resRow; pool.complete = (rows[resRow] || []).some(x => /^complete$/i.test(x)); }
    for (let r = st.r + 1; r < (st.resRow != null ? st.resRow : end); r++) {
      const row = rows[r] || [];
      for (let c = 0; c < row.length; c++) {
        const v = row[c];
        if (/^Match\s*#\s*\d+/i.test(v)) {
          const vs = row.findIndex((x, k) => k > c && /^vs\.?$/i.test(x));
          if (vs < 0) break;
          // Consolation pools put a "Team 3" placeholder beside each name; skip it
          const real = x => x && !/^team\s*\d+$/i.test(x) ? x : "";
          let a = "", b = "";
          for (let k = vs - 1; k > c + 2 && !a; k--) a = real(row[k]);
          for (let k = vs + 1; k < row.length && !b; k++) b = real(row[k]);
          pool.matches.push({ num: v.replace(/\D+/g, ""), court: at(r, c + 1), time: at(r, c + 2), a, b });
          break;
        }
        if (v === "Seed" && !seed) { seed = { r, c }; break; }
        if (st.resRow == null && /^Pool\s+.+\s+Results$/i.test(v)) { resRow = r; pool.complete = row.some(x => /^complete$/i.test(x)); break; }
      }
    }

    if (seed) {
      const hdr = rows[seed.r];
      const setsCol = hdr.findIndex(x => /^sets$/i.test(x));
      const names = hdr.slice(seed.c + 3, setsCol > 0 ? setsCol : undefined).filter(Boolean);
      const stop = resRow || end;
      for (let r = seed.r + 1; r < stop; r++) {
        const s = at(r, seed.c), team = at(r, seed.c + 1);
        if (/^\d+$/.test(s)) pool.slots++;   // seeded places, filled in or not
        if (!/^\d+$/.test(s) || !team) continue;
        const t = { seed: +s, team, sheetDiff: num(at(r, seed.c + 2)),
                    sheetW: setsCol > 0 ? num(at(r, setsCol)) : null, sheetL: setsCol > 0 ? num(at(r, setsCol + 1)) : null };
        pool.grid[team] = {};
        const row = rows[r];
        for (let j = seed.c + 3; j < row.length - 1; j++) {
          if (row[j] !== team || !names.includes(row[j + 1]) || row[j + 1] === team) continue;
          const opp = row[j + 1], sets = [];
          for (let rr = r + 1; rr < stop && /^set\s*\d+/i.test(at(rr, j - 1)); rr++) {
            const x = num(at(rr, j)), y = num(at(rr, j + 1));
            if (x !== null && y !== null && (x || y)) sets.push([x, y]);
          }
          pool.grid[team][opp] = sets;
        }
        pool.teams.push(t);
      }
    }

    // Totals from the set scores (falls back to the sheet's own numbers)
    pool.teams.forEach(t => {
      let w = 0, l = 0, pf = 0, pa = 0, any = false;
      Object.values(pool.grid[t.team] || {}).forEach(sets => sets.forEach(([x, y]) => { any = true; pf += x; pa += y; x > y ? w++ : l++; }));
      t.w = any ? w : (t.sheetW || 0); t.l = any ? l : (t.sheetL || 0);
      t.diff = any ? pf - pa : (t.sheetDiff || 0);
      t.pct = t.w + t.l ? t.w / (t.w + t.l) : 0;
    });

    if (resRow !== null) {
      for (let r = resRow + 1; r < Math.min(resRow + 4, end); r++) {
        const row = rows[r] || []; const rc = row.indexOf("Rank"); if (rc < 0) continue;
        const tc = row.indexOf("Team"), ac = row.findIndex(x => /^advancement$/i.test(x));
        pool.resultsNote = row.find(x => x.length > 60) || "";
        for (let rr = r + 1; rr < Math.min(r + 12, end); rr++) {
          const team = at(rr, tc); if (!team) break;
          pool.results.push({ rank: at(rr, rc), team, adv: ac >= 0 ? at(rr, ac) : "" });
        }
        break;
      }
    }

    pool.matches.forEach(m => {
      m.sets = (pool.grid[m.a] && pool.grid[m.a][m.b]) || [];
      m.played = m.sets.length > 0;
    });
    const firstOpen = pool.matches.find(m => !m.played);
    if (firstOpen) firstOpen.next = true;
    pool.state = pool.complete ? "final" : pool.matches.some(m => m.played) ? "live" : "new";
    return pool;
  });
  return { kind: "pools", pools, note };
}

/* ---------------- bracket parsing ---------------- */
function parseBrackets(rows) {
  const at = (r, c) => (rows[r] && rows[r][c]) || "";
  const isTime = v => /^\d{1,2}:\d{2}\s*[ap]\.?\s*m\.?$/i.test(v);
  const isScore = v => /^\d+\s*-\s*\d+(\s*,\s*\d+\s*-\s*\d+)*$/.test(v);
  // A team cell has its seed in the column to its left: "8A #1" (Gold Ball), "1" (Silver, Bronze) or "4A" (champion games)
  const isSeed = v => /#\s*\d+\s*$/.test(v) || /^\d{1,2}[A-Z]?$/i.test(v);
  // A title like "G18u 2026 NCHVC Heartland Regional" names only the event; the bracket is its colour word, if any
  const colourWord = t => { const w = (String(t).match(/\b(gold|silver|bronze|copper|iron|consolation)\b/i) || [])[0]; return w ? w[0].toUpperCase() + w.slice(1).toLowerCase() : ""; };
  const isTeam = (r, c) => at(r, c) && !isScore(at(r, c)) && !isTime(at(r, c)) && isSeed(at(r, c - 1));
  const cells = [];
  rows.forEach((row, r) => row.forEach((v, c) => { if (v) cells.push({ r, c, v }); }));

  // Matches: anchored on the start-time cell, with day above and court + match name below
  const matches = cells.filter(x => isTime(x.v)).map(({ r, c, v }) => {
    const m = { r, c, time: v, day: at(r - 1, c), court: at(r + 1, c), name: at(r + 2, c), format: "", top: null, bottom: null, sets: [], winner: null, loserTo: "" };
    for (let k = 1; k <= 7; k++) {
      const rr = r - k; if (rr < 0 || isTime(at(rr, c))) break;
      if (/best of \d/i.test(at(rr, c))) m.format = at(rr, c);
      if (isTeam(rr, c)) { m.top = { team: at(rr, c), seed: at(rr, c - 1), r: rr }; break; }
    }
    for (let k = 3; k <= 8; k++) {
      const rr = r + k; if (isTime(at(rr, c))) break;
      if (isTeam(rr, c)) { m.bottom = { team: at(rr, c), seed: at(rr, c - 1), r: rr }; break; }
    }
    // The score is written under the team that won, from the winner's side (sometimes a row lower)
    ["top", "bottom"].forEach(side => {
      const t = m[side]; if (!t) return;
      // "DNS" (did not show) under a team: the other team wins by forfeit
      if (/^(dns|no show|forfeit|ff)$/i.test(at(t.r + 1, c)) && !m.winner) { m.winner = side === "top" ? "bottom" : "top"; m.forfeit = t.team; return; }
      const sr = isScore(at(t.r + 1, c)) ? t.r + 1 : !at(t.r + 1, c) && isScore(at(t.r + 2, c)) ? t.r + 2 : -1;
      if (sr < 0) return;
      m.winner = side;
      m.sets = at(sr, c).split(",").map(x => x.trim().split(/\s*-\s*/).map(Number));
    });
    return m;
  });

  const nearest = (list, r) => list.reduce((best, x) => !best || Math.abs(x.r - r) < Math.abs(best.r - r) ? x : best, null);

  // One bracket per "... Champions" title ("... 1st Place" on tabs that have no Champions title)
  let titles = cells.filter(x => /champions?$/i.test(x.v) && x.v.length > 10);
  if (!titles.length) titles = cells.filter(x => /\b1st\s+place$/i.test(x.v) && x.v.length > 10);
  let groups = titles.map(x => {
    let champion = "";
    for (let k = 1; k <= 3 && !champion; k++) champion = at(x.r + k, x.c);
    const title = x.v.replace(/\s*(champions?|1st\s+place)$/i, "");
    // Button label: the class ("8A"), else what the title adds to the age and division ("Silver", "Bronze Ball")
    const rest = title.replace(/^[GB]\s*\d+\s*u\s+|^[GB]\s*JV\s+/i, "").replace(/^(Division\s+\S+|D\d)\s*/i, "").trim();
    const eventOnly = /\b\d{4}\b|nchvc|regional/i.test(rest);
    const label = (title.match(/\b\d+A\b/) || [])[0] || (eventOnly ? colourWord(rest) || "Champion" : rest || "Champion");
    return { r: x.r, title, label, key: label + "@" + x.r, champion, matches: [], results: [], complete: false, award: "" };
  });
  if (!groups.length) groups = [{ r: 0, title: "Bracket", label: "Bracket", key: "b0", champion: "", matches: [], results: [], complete: false, award: "" }];

  // Group matches by the class in their seed labels ("8A #1" -> 8A). Matches with no
  // teams yet (a final waiting on its semis) join the closest match that has a group.
  const labelOf = seed => String(seed || "").replace(/#\s*\d+\s*$/, "").trim().toLowerCase();
  const byLabel = v => groups.find(g => g.label.toLowerCase() === v);
  matches.forEach(m => { m.group = byLabel(labelOf(m.top && m.top.seed)) || byLabel(labelOf(m.bottom && m.bottom.seed)) || null; });
  const closestMatch = (r, c, list) => list.reduce((best, x) => {
    const d = Math.abs(x.r - r) + Math.abs(x.c - c);
    return !best || d < best.d ? { x, d } : best;
  }, null);
  const placed = matches.filter(m => m.group);
  matches.forEach(m => { if (!m.group) { const near = closestMatch(m.r, m.c, placed); m.group = near ? near.x.group : nearest(groups, m.r); } });
  matches.forEach(m => m.group.matches.push(m));
  // A title that only names the event takes its label from the match names ("G18u Gold Semi" -> "Gold")
  groups.forEach(g => { if (g.label === "Champion") g.label = g.matches.map(m => colourWord(m.name)).find(Boolean) || g.label; });
  // Results tables and awards: their own label ("8A Results") first, then the closest match
  const groupAt = (r, c, text) => {
    const g = groups.find(g => new RegExp("\\b" + g.label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i").test(text || ""));
    if (g) return g;
    const near = closestMatch(r, c, matches);
    return near ? near.x.group : nearest(groups, r);
  };

  // Where each losing team goes ("Losing team to" / destination / team)
  cells.filter(x => /^losing team to$/i.test(x.v)).forEach(x => {
    const to = at(x.r + 1, x.c); if (/game below/i.test(to)) return;   // points at a placement match shown anyway
    const m = nearest(matches, x.r); if (m) m.loserTo = to;
  });
  // Awards ("Winner:" / "Gold Ball & Medals")
  cells.filter(x => /^winner:?$/i.test(x.v)).forEach(x => {
    const row = rows[x.r]; const val = row.slice(x.c + 1).find(Boolean) || "";
    if (val) groupAt(x.r, x.c, "").award = val;
  });
  // Results tables
  cells.filter(x => /results$/i.test(x.v)).forEach(x => {
    const g = groupAt(x.r, x.c, x.v);
    g.complete = g.complete || (rows[x.r] || []).some(v => /^complete$/i.test(v));
    for (let r = x.r + 1; r <= x.r + 2; r++) {
      const row = rows[r] || []; const rc = row.indexOf("Rank"); if (rc < 0) continue;
      const ac = row.findIndex(v => /^advancement$/i.test(v)), tc = row.findIndex(v => /^teams?$/i.test(v));
      for (let rr = r + 1; rr < r + 12; rr++) {
        const team = at(rr, tc); if (!team) break;
        g.results.push({ rank: at(rr, rc), team, adv: ac >= 0 ? at(rr, ac) : "" });
      }
      break;
    }
  });

  // Placement titles ("G18u Division I Bronze 3rd Place") with the team a row or two below
  // (match names like "G18u D1 Bronze 3rd" sit two rows under a time cell and aren't titles)
  const nameCells = new Set(matches.map(m => (m.r + 2) + ":" + m.c));
  const placements = cells.filter(x => /\b(\d+)(st|nd|rd|th)(\s+place)?$/i.test(x.v) && x.v.length > 10 && !nameCells.has(x.r + ":" + x.c)).map(x => {
    let team = ""; for (let k = 1; k <= 3 && !team; k++) team = at(x.r + k, x.c);
    return { r: x.r, c: x.c, rank: +x.v.match(/\b(\d+)(st|nd|rd|th)(\s+place)?$/i)[1], team };
  }).filter(x => x.team);

  /* Rounds come from the match names when every match has a known kind ("Gold Semi",
     "Bronze Con Semi", "SILVER BALL", "Bronze 3rd"...): Quarterfinals, Semifinals and
     Final make the bracket, and 3rd place and the consolation side are listed below it.
     Otherwise rounds are the columns, rightmost being the Final. */
  const KINDS = [
    { k: "quarter", re: /quarter/i, name: "Quarterfinals", next: "semi" },
    { k: "consemi", re: /\bcon(s|solation)?\.?\s*semi/i, name: "Consolation semifinals", extra: true, next: "5th" },
    { k: "semi", re: /semi/i, name: "Semifinals", next: "final" },
    { k: "3rd", re: /\b3rd\b/i, name: "3rd place", extra: true },
    { k: "5th", re: /\b5th\b/i, name: "5th place", extra: true },
    { k: "7th", re: /\b7th\b/i, name: "7th place", extra: true },
    { k: "final", re: /\bball\b|champ|undisputed|final|\b1st\b/i, name: "Final" }
  ];
  const kindOf = m => KINDS.find(x => x.re.test(m.name));
  const ORDER = ["quarter", "semi", "final", "3rd", "consemi", "5th", "7th"];
  const roundNames = ["Final", "Semifinals", "Quarterfinals", "Round of 16", "Round of 32"];
  groups.forEach(g => {
    const byRow = list => list.sort((a, b) => a.r - b.r || a.c - b.c);
    let all;
    if (g.matches.length && g.matches.every(kindOf)) {
      all = ORDER.map(k => KINDS.find(x => x.k === k)).map(kd => ({ kind: kd, name: kd.name, extra: !!kd.extra,
        matches: byRow(g.matches.filter(m => kindOf(m) === kd)) })).filter(rd => rd.matches.length);
    } else {
      const cols = [...new Set(g.matches.map(m => m.c))].sort((a, b) => a - b);
      all = cols.map((c, i) => ({ name: roundNames[cols.length - 1 - i] || `Round ${i + 1}`, extra: false,
        matches: byRow(g.matches.filter(m => m.c === c)) }));
    }
    g.rounds = all.filter(rd => !rd.extra);
    g.extra = all.filter(rd => rd.extra);
    g.named = all.length > 0 && all.every(rd => rd.kind);
    // If a score wasn't found, a team that appears in the round its winner moves on to still counts as the winner
    // (by kind, so a loser moving to the consolation side isn't mistaken for the winner)
    all.forEach((rd, i) => {
      const later = rd.kind ? all.find(x => x.kind && x.kind.k === rd.kind.next) : (!rd.extra && g.rounds[g.rounds.indexOf(rd) + 1]);
      if (!later) return;
      const ahead = new Set(later.matches.flatMap(m => [m.top, m.bottom]).filter(Boolean).map(t => t.team));
      rd.matches.forEach(m => {
        if (m.winner) return;
        if (m.top && ahead.has(m.top.team)) m.winner = "top";
        else if (m.bottom && ahead.has(m.bottom.team)) m.winner = "bottom";
      });
    });
    const fin = g.rounds.length ? g.rounds[g.rounds.length - 1].matches[0] : null;
    if (!g.champion && fin && fin.winner) g.champion = fin[fin.winner].team;
    /* No results table: build one from the final and the 3rd/5th/7th place matches
       (winner takes that place, loser the next), falling back to the placement titles
       ("… 3rd Place" with the team below) for a match without a score */
    if (!g.results.length && g.champion && g.extra.length) {
      const mine = placements.filter(x => groupAt(x.r, x.c, "") === g);
      const places = {};
      const put = (rank, m) => {
        if (m && m.winner) { places[rank] = m[m.winner].team; const l = m[m.winner === "top" ? "bottom" : "top"]; if (l) places[rank + 1] = l.team; }
        else { const t = mine.find(x => x.rank === rank); if (t) places[rank] = t.team; }
      };
      places[1] = g.champion; put(1, fin);
      [3, 5, 7].forEach(n => { const rd = all.find(x => x.kind && x.kind.k === n + (n === 3 ? "rd" : "th")); put(n, rd && rd.matches[0]); });
      g.results = Object.keys(places).map(Number).sort((a, b) => a - b).map(n => ({ rank: String(n), team: places[n], adv: "" }));
    }
    g.state = g.complete || g.champion ? "final" : g.matches.some(m => m.winner) ? "live" : "new";
    const firstOpen = all.flatMap(rd => rd.matches).find(m => !m.winner && m.top && m.bottom);
    if (firstOpen) firstOpen.next = true;
    g.teams = [...new Set(g.matches.flatMap(m => [m.top, m.bottom]).filter(Boolean).map(t => t.team))];
  });
  const note = (cells.find(x => /^text scores/i.test(x.v)) || {}).v || "";
  return { kind: "brackets", brackets: groups.sort((a, b) => a.r - b.r), note };
}

/* ---------------- fetching ---------------- */
function linkParts(url) {
  const s = String(url || "");
  const id = (s.match(/\/d\/([a-zA-Z0-9_-]{20,})/) || [])[1];
  // No gid means the sheet's first tab (the export and gviz feeds default to it)
  const gid = (s.match(/[#?&]gid=(\d+)/) || [])[1] || "";
  return id ? { id, gid } : null;
}

async function fetchRows(parts) {
  const t = Date.now(), gid = parts.gid ? `&gid=${parts.gid}` : "";
  const urls = [
    `https://docs.google.com/spreadsheets/d/${parts.id}/export?format=csv${gid}&t=${t}`,
    `https://docs.google.com/spreadsheets/d/${parts.id}/gviz/tq?tqx=out:csv&headers=0${gid}&t=${t}`
  ];
  const errs = [];
  for (const u of urls) {
    try {
      const res = await fetch(u, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if (/^\s*</.test(text)) throw new Error("got a sign-in page");
      return parseCSV(text);
    } catch (e) { errs.push(e.message); }
  }
  // Backup: load through a script tag, which browsers allow even when they block fetch
  try { return await loadViaScript(parts); }
  catch (e) { errs.push(e.message); }
  const err = new Error("fetch"); err.detail = errs.join("; "); throw err;
}

function loadViaScript(parts) {
  return new Promise((resolve, reject) => {
    const cb = "__sheet" + Date.now();
    const s = document.createElement("script");
    const timer = setTimeout(() => { done(); reject(new Error("backup timed out")); }, 15000);
    function done() { clearTimeout(timer); try { delete window[cb]; } catch (e) {} s.remove(); }
    window[cb] = d => {
      done();
      if (!d || d.status === "error" || !d.table) return reject(new Error("backup returned an error"));
      resolve(d.table.rows.map(r => (r.c || []).map(c => c ? String(c.f != null ? c.f : (c.v != null ? c.v : "")).trim() : "")));
    };
    s.onerror = () => { done(); reject(new Error("backup blocked")); };
    s.src = `https://docs.google.com/spreadsheets/d/${parts.id}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=0${parts.gid ? "&gid=" + parts.gid : ""}&t=${Date.now()}`;
    document.head.appendChild(s);
  });
}

/* ---------------- state ---------------- */
let settings = load();                 // { division, follow, custom: [], auto }
const store = {};                      // division id -> cached results
let flashKeys = new Set(), autoTimer = null, setup = false;
const $ = id => document.getElementById(id);

function load() { try { return { custom: [], ...(JSON.parse(localStorage.getItem(KEY)) || {}) }; } catch (e) { return { custom: [] }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) {} }
const divisions = () => [...baseDivisions(), ...(settings.custom || [])];
const typeOf = d => d.type || "pools";
let configDivs = loadCachedConfig();
let configWarning = "";
function loadCachedConfig() { try { const c = JSON.parse(localStorage.getItem(KEY + "-config")); return c && (c.rows || c.divs || []).length ? c : null; } catch (e) { return null; } }

function parseConfig(rows) {
  const low = v => String(v || "").toLowerCase();
  const hr = rows.findIndex(r => r.some(v => low(v) === "stage") && r.some(v => /^(link|url)$/.test(low(v))));
  if (hr < 0) throw new Error("Couldn't find the Stage and Link column headings");
  const h = rows[hr].map(low);
  const cStage = h.indexOf("stage"), cName = h.findIndex(v => /^(division|name)$/.test(v)),
        cLink = h.findIndex(v => /^(link|url)$/.test(v)), cShow = h.indexOf("show"),
        cGender = h.findIndex(v => /^(gender|boys or girls|boys\/girls)$/.test(v)), cAge = h.findIndex(v => /^(age|age group)$/.test(v)),
        cLevel = h.findIndex(v => /^(level|div|division level)$/.test(v)), cBracket = h.findIndex(v => /^(bracket|bracket level)$/.test(v));
  const opt = (r, c) => c >= 0 ? (r[c] || "").trim() : "";
  // rows keeps every entry, hidden ones and ones without a link too, so they can
  // hide, rename or retag divisions found on the NCHVC index
  const entries = []; let event = "";
  rows.slice(hr + 1).forEach(r => {
    const stage = low(r[cStage]), name = (r[cName] || "").trim(), link = (r[cLink] || "").trim();
    if (/^event/.test(stage)) { event = name; return; }
    if (!stage && !name && !link) return;
    const type = /bracket/.test(stage) ? "brackets" : /pool/.test(stage) ? "pools" : null;
    if (!type || !name) return;
    const g = opt(r, cGender);
    entries.push({ id: divId(type, name), type, name, url: link,
      hidden: cShow >= 0 && /^(no|n|false|hide|hidden)$/.test(low(r[cShow])),
      gender: /^b/i.test(g) ? "Boys" : /^g/i.test(g) ? "Girls" : g, age: opt(r, cAge).toUpperCase(), level: opt(r, cLevel), bracket: opt(r, cBracket) });
  });
  const visible = entries.filter(e => !e.hidden);
  return { divs: visible.filter(e => linkParts(e.url)), rows: entries, event, skipped: visible.filter(e => !linkParts(e.url)).map(e => e.name) };
}
const divId = (type, name) => type + ":" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
const noTags = (k, v) => k === "_tags" ? undefined : v;

async function loadConfig() {
  const parts = linkParts(CONFIG_SHEET);
  if (!parts) return;
  try {
    const c = parseConfig(await fetchRows(parts));
    configWarning = "";
    if (c.rows.length) {
      configDivs = c; listCache = null;
      try { localStorage.setItem(KEY + "-config", JSON.stringify(c, noTags)); } catch (e) {}
    }
  } catch (e) {
    configWarning = configDivs ? "" : "Couldn't read the divisions sheet, so the saved list of divisions is showing.";
  }
}
const eventName = () => (configDivs && configDivs.event) || (discovered && discovered.event) || "2025 NCHVC";

/* ---------------- division list: the divisions sheet ---------------- */
/* The divisions sheet is the list. It's filled once from the NCHVC index: the Add a
   division page shows its rows ready to paste (from SAVED_LIST, or rebuilt through the
   Sheets API with "Build rows from the NCHVC index"). SAVED_LIST is used only when the
   sheet can't be read. */
let discovered = SAVED_LIST;           // { at, divs, failed, event, books }: the latest index discovery, for building sheet rows
let listCache = null, mergeWarning = "", discoveryError = "", discovery = null;
try { localStorage.removeItem(KEY + "-discovered"); } catch (e) {}   // older versions kept a rebuilt list here

const sameTab = (a, b) => { const x = linkParts(a), y = linkParts(b); return !!(x && y && x.id === y.id && x.gid === y.gid); };
function buildList() {
  mergeWarning = "";

  if ((configDivs.skipped || []).length) mergeWarning = linkWarning(configDivs.skipped);
  // A second row for a tab or name already on the list adds nothing
  return configDivs.divs.filter((d, i, all) => all.findIndex(x => x.id === d.id || sameTab(x.url, d.url)) === i);
}
const linkWarning = names => `The divisions sheet has a row without a full Google Sheets address for: ${names.join(", ")}. Paste the whole address as plain text in the Link column.`;

/* Rows for the divisions sheet from an index discovery, tab separated so they paste
   into Google Sheets as cells. Rows already in the sheet keep their name, Show and
   tags; unreadable tabs come in hidden (Show = No). Other sheet rows stay at the end
   only if they're from one of the index's spreadsheets, so switching to a new index
   (next year, or Regionals) leaves the old event's rows out. */
function sheetRows(found) {
  const rows = (configDivs && configDivs.rows) || [];
  const used = new Set();
  const mine = d => { const i = rows.findIndex((r, k) => !used.has(k) && r.url && sameTab(r.url, d.url)); if (i >= 0) used.add(i); return i >= 0 ? rows[i] : null; };
  const stage = t => t === "brackets" ? "Bracket play" : "Pool play";
  const books = new Set([...found.divs, ...(found.failed || [])].map(d => (linkParts(d.url) || {}).id).filter(Boolean));
  const sameEvent = rows.some(r => books.has((linkParts(r.url) || {}).id));
  const out = [["Stage", "Division", "Link", "Show", "Gender", "Age", "Level", "Bracket"], ["Event", (sameEvent && configDivs.event) || found.event || "", "", "", "", "", "", ""]];
  const add = (d, show) => { const r = mine(d);
    out.push([stage(d.type), r ? r.name : d.name, d.url, r && r.hidden ? "No" : show, r ? r.gender : "", r ? r.age : "", r ? r.level : "", r ? r.bracket : ""]); };
  found.divs.forEach(d => add(d, "Yes"));
  (found.failed || []).filter(f => f.url).forEach(f => add({ type: /pool/i.test(f.tab) ? "pools" : "brackets", name: f.name, url: f.url }, "No"));
  rows.forEach((r, k) => { if (!used.has(k) && books.has((linkParts(r.url) || {}).id) && !out.some(o => sameTab(o[2], r.url))) out.push([stage(r.type), r.name, r.url, r.hidden ? "No" : "Yes", r.gender, r.age, r.level, r.bracket]); });

async function sheetsApi(id, fields) {
  // The key is restricted to this site's address, so send the full page URL as the
  // referrer (browsers send only the domain on cross-site requests by default)
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}?fields=${encodeURIComponent(fields)}&key=${encodeURIComponent(API_KEY)}`,
    { referrerPolicy: "no-referrer-when-downgrade", cache: "no-store" });
  if (!res.ok) {
    let msg = ""; try { msg = (await res.json()).error.message; } catch (e) {}
    const err = new Error(msg || "HTTP " + res.status); err.status = res.status; throw err;
  }
  return res.json();
}

// Runs fn over items, a few at a time; a 429 from any of them stops the rest
async function eachLimit(items, n, fn) {
  const out = new Array(items.length); let next = 0, stop = null;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (next < items.length && !stop) {
      const i = next++;
      try { out[i] = await fn(items[i], i); } catch (e) { if (e.status === 429) stop = e; else out[i] = { error: e }; }
    }
  }));
  if (stop) throw stop;
  return out;
}

/* Division links on the index: "G18u D1", "GJV", "B16u"... Links can be a cell
   hyperlink, a rich-text link, or a HYPERLINK() formula. */
function indexLinks(data, gid) {
  const sheets = data.sheets || [];
  const tab = sheets.find(x => String(x.properties.sheetId) === gid) || sheets[0];
  const out = [], seen = new Set();
  ((tab && tab.data) || []).forEach(g => (g.rowData || []).forEach(row => (row.values || []).forEach(v => {
    const label = String(v.formattedValue || "").trim();
    if (!/^[GB]\s*(\d{1,2}\s*u|JV)\b/i.test(label)) return;
    const formula = ((v.userEnteredValue && v.userEnteredValue.formulaValue) || "").match(/HYPERLINK\(\s*"([^"]+)"/i);
    const urls = [v.hyperlink, ...(v.textFormatRuns || []).map(r => r.format && r.format.link && r.format.link.uri), formula && formula[1]];
    // Links can be ".../spreadsheets/d/ID" or ".../spreadsheets/u/0/d/ID" (a signed-in account's form)
    const id = urls.map(u => (String(u || "").match(/\/spreadsheets\/(?:u\/\d+\/)?d\/([a-zA-Z0-9_-]{20,})/) || [])[1]).find(Boolean);
    if (id && !seen.has(id)) { seen.add(id); out.push({ label, id }); }
  })));
  return out;
}

// "Girls 18u D1/D2 Pools - 2025 NCHVC" -> "Girls 18U D1/D2"; the index label ("G18u D1") if the title doesn't say
function bookName(label, title) {
  let t = String(title || "").replace(/\s*-\s*\d{4}\b.*$/i, "").trim();
  if (!/^(girls|boys)\b/i.test(t)) t = label.replace(/^G\s*/i, "Girls ").replace(/^B\s*/i, "Boys ");
  return t.replace(/\bpools?\b|&\s*qualifier/gi, "").replace(/(\d+)\s*u\b/gi, "$1U").replace(/\s+/g, " ").trim();
}
// "D1 Gold Ball Brackets" in "Girls 18U D1" -> "Girls 18U D1 Gold Ball"; a "Pools" tab is just the division name
function tabName(base, title, type) {
  let t = title.trim().replace(/^(D\d)\s+/i, (m, lv) => new RegExp("\\b" + lv + "\\b", "i").test(base) ? "" : m);
  if (type === "pools") return /^pools?$/i.test(t) ? base : `${base} ${t}`;
  return `${base} ${t.replace(/\s*brackets?$/i, "")}`.trim();
}
const SKIP_TABS = /^(home|ref|referees?|instructions?)$/i;

/* A tab counts only if the parser finds real content in it, not just time cells. For
   brackets, every one on the tab must also be a layout the parser is known to read:
   rounds named from the match names, each round feeding the next (half the size, or
   the same size when top seeds have a bye) and a single final. */
function tabReadable(d, rows) {
  // Before seeding a pool has numbered places and a schedule but no team names yet
  if (d.type === "pools") return parsePools(rows).pools.some(p => p.teams.length >= 2 || (p.slots >= 2 && p.matches.length));
  const list = parseBrackets(rows).brackets.filter(g => g.key !== "b0" && g.matches.length);
  // Each round feeds the next: half as many matches, or as many when top seeds get a bye
  const halves = g => g.rounds.every((rd, i) => { const n = g.rounds[i + 1]; return !n || (rd.matches.length >= n.matches.length && rd.matches.length <= 2 * n.matches.length); })
    && (!g.rounds.length || g.rounds[g.rounds.length - 1].matches.length === 1)
    && (g.rounds.length < 2 || g.rounds[g.rounds.length - 2].matches.length === 2);
  // The layout check is enough on its own, so brackets are kept before teams are placed in them
  return list.length > 0 && list.every(g => g.named && halves(g));
}

async function discoverDivisions(progress) {
  const ip = linkParts(INDEX_SHEET);
  const index = await sheetsApi(ip.id, "sheets(properties(sheetId,title),data(rowData(values(formattedValue,hyperlink,textFormatRuns(format(link(uri))),userEnteredValue(formulaValue)))))");
  const links = indexLinks(index, ip.gid);
  if (!links.length) throw new Error("no division links on the index");
  const failed = [], candidates = []; let event = "";
  // Tab lists: one read per division spreadsheet (the API can't batch across spreadsheets)
  const books = await eachLimit(links, 4, l => sheetsApi(l.id, "properties(title),sheets(properties(sheetId,title,hidden))"));
  books.forEach((b, i) => {
    const l = links[i];
    if (!b || b.error) return failed.push({ name: l.label, tab: "", reason: "couldn't list its tabs" + (b && b.error ? ` (${b.error.message})` : "") });
    const title = (b.properties && b.properties.title) || "";
    // "Girls 18u D1 - 2025 NCHVC" -> "2025 NCHVC"; "Girls 18u - 2026 Heartland - NCHVC" -> "2026 Heartland NCHVC"
    event = event || ((title.match(/-\s*(\d{4}\b.*)$/) || [])[1] || "").replace(/\s*-\s*/g, " ").trim();
    const base = bookName(l.label, title);
    (b.sheets || []).forEach(({ properties: p }) => {
      if (p.hidden || SKIP_TABS.test(p.title.trim())) return;
      const type = /pool/i.test(p.title) ? "pools" : "brackets";
      const name = tabName(base, p.title, type);
      candidates.push({ id: divId(type, name), type, name, url: `https://docs.google.com/spreadsheets/d/${l.id}/edit#gid=${p.sheetId}`, tab: p.title, book: l.label });
    });
  });
  // Confirm each tab through the public CSV feed, the same path scores load from (no API quota)
  let done = 0;
  const ok = await eachLimit(candidates, 4, async d => {
    try { return tabReadable(d, await fetchRows(linkParts(d.url))) || { error: new Error("no " + (d.type === "pools" ? "pools" : "brackets") + " found") }; }
    catch (e) { return { error: new Error("couldn't load it") }; }
    finally { progress && progress(++done, candidates.length); }
  });
  const divs = [];
  candidates.forEach((d, i) => {
    if (ok[i] === true) divs.push({ id: d.id, type: d.type, name: d.name, url: d.url });
    else failed.push({ name: d.name, tab: d.tab, book: d.book, url: d.url, reason: ok[i].error.message });
  });

}

function backoffLeft() { try { const b = JSON.parse(localStorage.getItem(KEY + "-backoff")) || {}; return Math.max(0, (b.until || 0) - Date.now()); } catch (e) { return 0; } }
function setBackoff(hitLimit) {
  let b = {}; try { b = JSON.parse(localStorage.getItem(KEY + "-backoff")) || {}; } catch (e) {}
  // Google's "too many requests": wait 10 minutes, doubling each time up to 2 hours
  const wait = hitLimit ? Math.min((b.wait || 5 * 60e3) * 2, 2 * 3600e3) : 10 * 60e3;
  try { localStorage.setItem(KEY + "-backoff", JSON.stringify({ until: Date.now() + wait, wait })); } catch (e) {}
}

// Runs only when someone clicks "Build rows from the NCHVC index", never on page load or score refreshes.
// The result only fills in the rows to paste into the divisions sheet; the list itself comes from the sheet.
async function updateDivisionList() {
  if (discovery || !API_KEY || !linkParts(INDEX_SHEET) || backoffLeft()) return;
  discovery = { done: 0, total: 0 };
  if (setup) renderSetup();
  try {
    const found = await discoverDivisions((done, total) => { discovery = { done, total }; if (setup) renderListStatus(); });
    if (!found.divs.length) throw new Error("none of the index's tabs could be read");
    discovered = found; discoveryError = "";
    try { localStorage.removeItem(KEY + "-backoff"); } catch (e) {}
  } catch (e) {
    setBackoff(e.status === 429);
    discoveryError = e.status === 429 ? "Google asked us to slow down." : e.message;
  }
  discovery = null;
  if (setup) renderListStatus();
}
const currentStage = () => settings.stage || typeOf(divisions().find(d => d.id === settings.division) || divisions()[0] || {});
/* Filter tags come from the divisions sheet's optional Gender, Age, Level and
   Bracket columns, or are read from the division name ("Girls 18U D1 Gold Ball"). */
function tagsOf(d) {
  if (d._tags) return d._tags;
  const n = " " + d.name + " ";
  const gender = d.gender || (/\b(girls?|women)\b|\bG(?=\d{1,2}\s*u\b|JV\b)/i.test(n) ? "Girls" : /\b(boys?|men)\b|\bB(?=\d{1,2}\s*u\b|JV\b)/i.test(n) ? "Boys" : "");
  const ageM = n.match(/(\d{1,2})\s*u\b/i);
  const age = d.age || (ageM ? ageM[1] + "U" : /JV\b/i.test(n) ? "JV" : "");
  const roman = { I: 1, II: 2, III: 3, IV: 4 };
  let levels = d.level ? String(d.level).split(/[\/,&]| and /i).map(x => x.trim()).filter(Boolean)
    .map(x => { const m = x.match(/(\d)|\b(IV|I{1,3})\b/i); return m ? "D" + (m[1] || roman[m[2].toUpperCase()]) : x; }) : [];
  if (!levels.length) {
    (n.match(/\bD\s*[1-4]\b|\/\s*D?[1-4]\b/gi) || []).forEach(x => levels.push("D" + x.replace(/\D/g, "")));
    (n.match(/\bDivision\s+(IV|I{1,3})\b/gi) || []).forEach(x => levels.push("D" + roman[x.split(/\s+/)[1].toUpperCase()]));
  }
  levels = [...new Set(levels)];
  // A "Gold & Silver" tab holds both brackets, so it gets both tags
  const bracket = d.bracket ? [d.bracket] : /gbss/i.test(n) ? ["GBSS"] : /gold\s*(&|and)\s*silver/i.test(n) ? ["Gold", "Silver"]
    : ["Gold", "Silver", "Bronze", "Copper", "Iron"].filter(x => new RegExp(x, "i").test(n)).slice(0, 1);

}
const FILTERS = [
  { key: "gender", label: "Boys or girls", stages: ["pools", "brackets"] },
  { key: "age", label: "Age group", stages: ["pools", "brackets"] },
  { key: "level", label: "Division", stages: ["pools", "brackets"] },
  { key: "bracket", label: "Bracket", stages: ["brackets"] }
];
/* One set of filter choices for both stages, so they stay put when switching between
   Pool play and Bracket play. Only a stage's own filters apply to it (the Bracket
   choice is kept while on Pool play). Older saves kept a set per stage. */
const allFilters = () => settings.sharedFilters || (settings.filters && settings.filters[settings.stage || "pools"]) || {};
const filtersFor = stage => {
  const f = allFilters(), keys = FILTERS.filter(x => x.stages.includes(stage)).map(x => x.key);
  return Object.fromEntries(keys.filter(k => f[k]).map(k => [k, f[k]]));
};

}

    const v = tagsOf(d)[key]; (Array.isArray(v) ? v : [v]).forEach(x => x && vals.add(x));
  });
  const order = { gender: ["Girls", "Boys"], bracket: ["Gold", "Silver", "Bronze", "Copper", "Iron", "GBSS"] };
  return [...vals].sort((a, b) => {
    if (key === "age") return (parseInt(b) || 0) - (parseInt(a) || 0) || a.localeCompare(b);
    const o = order[key]; if (o) return ((o.indexOf(a) + 1) || 99) - ((o.indexOf(b) + 1) || 99) || a.localeCompare(b);
    return a.localeCompare(b, undefined, { numeric: true });

const visibleDivisions = stage => divisions().filter(d => typeOf(d) === stage && fits(d, filtersFor(stage)));
const current = () => {
  const stage = settings.stage || typeOf(divisions().find(d => d.id === settings.division) || divisions()[0] || {});
  const list = visibleDivisions(stage);
  return list.find(d => d.id === settings.division) || list[0] || { id: "__none", name: "No matching divisions", type: stage, url: "" };
};
function slot(id) { return store[id] || (store[id] = { model: null, prevKeys: null, lastUpdated: null, error: null, errorDetail: "", active: null, busy: false }); }

function snapshot(m) {
  const keys = {};
  if (m.kind === "brackets") {
    m.brackets.forEach(g => g.matches.forEach(x => keys[`${g.key}|m${x.r}-${x.c}`] =
      JSON.stringify([x.top && x.top.team, x.bottom && x.bottom.team, x.sets, x.winner])));
    return keys;
  }
  m.pools.forEach(p => {
    p.matches.forEach(x => keys[`${p.letter}|m${x.num}`] = JSON.stringify(x.sets));
    p.teams.forEach(t => keys[`${p.letter}|t${t.team}`] = `${t.w}-${t.l}-${t.diff}`);
  });
  return keys;
}

async function refresh() {
  const d = current(), s = slot(d.id);
  if (d.id === "__none") return;
  const parts = linkParts(d.url);
  if (!parts) { s.error = "fetch"; s.errorDetail = "The link for this division isn't a Google Sheets link."; render(); return; }
  if (s.busy) return;
  s.busy = true; busy(true);
  try {
    const rows = await fetchRows(parts);
    const next = (d.type || "pools") === "brackets" ? parseBrackets(rows) : parsePools(rows);
    const items = next.kind === "brackets" ? next.brackets.filter(g => g.matches.length) : next.pools;
    if (!items.length) throw new Error("No pools found");
    const keys = snapshot(next);
    const changed = s.prevKeys ? Object.keys(keys).filter(k => s.prevKeys[k] !== undefined && s.prevKeys[k] !== keys[k]) : [];
    if (current().id === d.id) flashKeys = new Set(changed);
    s.prevKeys = keys; s.model = next; s.error = null; s.errorDetail = ""; s.lastUpdated = new Date();
    const keyOf = x => next.kind === "brackets" ? x.key : x.letter;
    const hasTeam = x => next.kind === "brackets" ? x.teams.includes(settings.follow) : x.teams.some(t => t.team === settings.follow);
    if (!s.active || !items.some(x => keyOf(x) === s.active)) {
      const mine = settings.follow && items.find(hasTeam);
      s.active = keyOf(mine || items[0]);
    }
  } catch (e) {
    s.error = e.message === "No pools found" ? "nopools" : "fetch";
    s.errorDetail = e.detail || e.message || "";
  }
  s.busy = false;
  if (current().id === d.id) { busy(false); render(); }
}

function busy(on) {
  $("refreshBtn").disabled = on; $("refreshBtn").classList.toggle("loading", on);
  $("refreshLabel").textContent = on ? "Refreshing…" : "Refresh results";
}

function updateStatus() {
  const s = slot(current().id);
  if (!s.lastUpdated) { $("status").textContent = s.error ? "Couldn't load results" : "Loading results…"; return; }
  const mins = Math.floor((Date.now() - s.lastUpdated) / 60000);
  const time = s.lastUpdated.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const ago = mins < 1 ? "just now" : mins === 1 ? "1 minute ago" : `${mins} minutes ago`;
  $("status").innerHTML = `Updated ${time} <span class="${mins >= 10 ? "stale" : ""}">(${ago})</span>`;
}

/* ---------------- rendering ---------------- */
const esc = v => String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const signed = n => n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "0";

function renderDivisions() {
  const cur = current().id;
  const stage = currentStage();
  document.querySelectorAll("#stages button").forEach(b => b.setAttribute("aria-pressed", b.dataset.stage === stage));
  const btn = d => `<button type="button" data-div="${esc(d.id)}" aria-pressed="${!setup && d.id === cur}">${esc(d.name)}</button>`;
  const f = filtersFor(stage);
  const active = FILTERS.filter(x => x.stages.includes(stage));
  $("filters").innerHTML = active.map(x => {
    const opts = filterOptions(stage, x.key);
    return `<label>${esc(x.label)}<select data-filter="${x.key}"><option value="">All</option>${
      opts.map(v => `<option ${v === f[x.key] ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></label>`;
  }).join("") + (active.some(x => f[x.key]) ? `<button type="button" class="linkish" id="clearFilters">Clear filters</button>` : "");
  const list = visibleDivisions(stage);
  $("divs").innerHTML = list.map(btn).join("") +
    `<button type="button" class="add" id="addDiv" aria-pressed="${setup}">Add a division</button>`;
}

const notices = () => { baseDivisions(); return [configWarning, mergeWarning].filter(Boolean).map(w => `<div class="msg err"><p>${esc(w)}</p></div>`).join(""); };
function render() {
  const d = current(), s = slot(d.id);
  document.title = d.name + (d.type === "brackets" ? " brackets" : " pools"); $("title").textContent = d.name;
  $("eventLine").textContent = eventName() + (d.type === "brackets" ? " bracket play" : " pool play");
  renderDivisions(); updateStatus(); busy(s.busy);
  if (setup) { $("bar").hidden = true; return renderSetup(); }
  if (d.id === "__none") {
    $("bar").hidden = true; $("status").textContent = "";
    $("eventLine").textContent = eventName();
    $("main").innerHTML = notices() + `<div class="msg"><h2>No divisions match these filters</h2><p>Try a different combination, or clear the filters.</p>
      <p><button class="ghost" type="button" id="clearFilters2">Clear filters</button></p></div>`;
    $("clearFilters2").addEventListener("click", clearFilters);

  }

  let html = notices();
  if (s.error) {
    const inPreview = location.protocol === "blob:" || /claude|anthropic/.test(location.hostname);
    html += `<div class="msg err"><h2>${s.error === "nopools" ? `Couldn't find any ${d.type === "brackets" ? "brackets" : "pools"} on that tab` : "Couldn't reach the sheet"}</h2>
      <p>${s.error === "nopools"
        ? `Make sure the link points at a ${d.type === "brackets" ? "bracket" : "pool play"} tab (it should end in #gid= followed by that tab's number).`
        : "Check your connection and that the sheet is still shared as “Anyone with the link can view.”"}
      ${s.model ? " Showing the last results that loaded." : ""}</p>
      ${inPreview ? "<p>This preview window blocks outside connections. Download the file and open it in your browser.</p>" : ""}
      ${s.errorDetail ? `<p style="color:var(--muted);font-size:14px">Details: ${esc(s.errorDetail)}</p>` : ""}</div>`;
  }
  const model = s.model;
  if (!model) { $("bar").hidden = true; $("main").innerHTML = html; return; }

  $("bar").hidden = false;
  if (model.kind === "brackets") return renderBrackets(s, html);
  $("pools").innerHTML = model.pools.map(p =>
    `<button type="button" data-pool="${esc(p.letter)}" aria-pressed="${p.letter === s.active}" class="${p.complete ? "done" : ""}" aria-label="${esc(p.name)}${p.complete ? ", final" : ""}">${esc(p.letter)}</button>`).join("");
  const allTeams = model.pools.flatMap(p => p.teams.map(t => t.team)).sort((a, b) => a.localeCompare(b));
  $("followSel").innerHTML = `<option value="">None</option>` + allTeams.map(t => `<option ${t === settings.follow ? "selected" : ""}>${esc(t)}</option>`).join("");

  const p = model.pools.find(x => x.letter === s.active) || model.pools[0];
  const fl = k => flashKeys.has(`${p.letter}|${k}`) ? " flash" : "";
  const mine = t => settings.follow && t === settings.follow ? " mine" : "";
  const courts = [...new Set(p.matches.map(m => m.court).filter(Boolean))];
  const badge = p.state === "final" ? `<span class="badge final">Final</span>` : p.state === "live" ? `<span class="badge live">In progress</span>` : `<span class="badge">Not started</span>`;

  let standings;
  if (p.complete && p.results.length) {
    const byTeam = Object.fromEntries(p.teams.map(t => [t.team, t]));
    standings = p.results.map((r, i) => ({ ...(byTeam[r.team] || { w: 0, l: 0, diff: 0 }), team: r.team, place: i + 1, adv: r.adv }));
  } else {
    standings = [...p.teams].sort((a, b) => b.pct - a.pct || b.diff - a.diff || a.seed - b.seed).map((t, i) => ({ ...t, place: i + 1 }));
  }
  const table = `<table><thead><tr><th></th><th>Team</th><th class="n">Sets</th><th class="n">Points</th></tr></thead><tbody>${
    standings.map(t => `<tr class="${mine(t.team).trim()}"><td class="rank">${t.place}</td>
      <td class="${fl("t" + t.team).trim()}"><span class="team">${esc(t.team)}</span>${t.adv ? `<span class="adv">Advances to ${esc(t.adv)}</span>` : ""}</td>
      <td class="n${fl("t" + t.team)}">${t.w}–${t.l}</td><td class="n${fl("t" + t.team)}">${signed(t.diff)}</td></tr>`).join("")
  }</tbody></table>`;
  let standNote = p.complete ? "Final order and advancement from the tournament sheet."
    : "Unofficial order by sets won, then point difference. Final placement comes from the tournament once the pool is complete.";
  if (p.resultsNote) standNote += " " + p.resultsNote;

  const matches = p.matches.map(m => {
    const aw = m.sets.filter(([x, y]) => x > y).length, bw = m.sets.length - aw;
    const res = !m.played ? ["none", "none"] : aw > bw ? ["won", "lost"] : bw > aw ? ["lost", "won"] : ["none", "none"];
    const setCells = side => m.sets.map(([x, y]) => { const me = side ? y : x, them = side ? x : y; return `<span class="${me > them ? "w" : ""}">${me}</span>`; }).join("");
    const when = /rolling/i.test(m.time) ? "Follows previous match" : esc(m.time);
    const where = courts.length > 1 && m.court ? `, ${esc(m.court.replace(/^Sports Pavilion\s*#?\s*/i, "Court "))}` : "";
    const tag = m.played ? (aw === bw ? `<span class="tag final">Split ${aw}–${bw}</span>` : `<span class="tag final">Final</span>`)
              : m.next ? `<span class="tag next">Up next</span>` : "";
    return `<li class="${(mine(m.a) || mine(m.b)).trim()}${fl("m" + m.num)}">
      <div class="mhead"><span>Match ${esc(m.num)}: ${when}${where}</span>${tag}</div>
      <div class="side ${res[0]}"><span class="nm">${m.a ? esc(m.a) : `<em style="color:var(--muted);font-weight:400">To be decided</em>`}</span><span class="sets">${setCells(0)}</span></div>
      <div class="side ${res[1]}"><span class="nm">${m.b ? esc(m.b) : `<em style="color:var(--muted);font-weight:400">To be decided</em>`}</span><span class="sets">${setCells(1)}</span></div></li>`;
  }).join("");

  html += `<div class="pool-head"><h2>${esc(p.name)}</h2>${badge}<span class="where">${esc(courts.join(" and "))}</span></div>
    <div class="grid">
      <section class="card"><h3>Standings</h3>${table}<p class="note">${esc(standNote)}</p></section>
      <section class="card"><h3>Matches</h3><ol class="matches">${matches}</ol></section>
    </div>
    ${model.note ? `<footer>${esc(model.note)}</footer>` : ""}`;
  $("main").innerHTML = html;
  flashKeys = new Set();
}

function renderBrackets(s, html) {
  const model = s.model;
  const list = model.brackets.filter(g => g.matches.length);
  $("pools").innerHTML = list.map(g =>
    `<button type="button" data-pool="${esc(g.key)}" aria-pressed="${g.key === s.active}" class="${g.state === "final" ? "done" : ""}" aria-label="${esc(g.title)}${g.state === "final" ? ", final" : ""}">${esc(g.label)}</button>`).join("");
  const allTeams = [...new Set(list.flatMap(g => g.teams))].sort((a, b) => a.localeCompare(b));
  $("followSel").innerHTML = `<option value="">None</option>` + allTeams.map(t => `<option ${t === settings.follow ? "selected" : ""}>${esc(t)}</option>`).join("");

  const g = list.find(x => x.key === s.active) || list[0];
  const mine = t => settings.follow && t === settings.follow;
  const badge = g.state === "final" ? `<span class="badge final">Final</span>` : g.state === "live" ? `<span class="badge live">In progress</span>` : `<span class="badge">Not started</span>`;
  const courtName = c => esc(String(c || "").replace(/^Sports Pavilion\s*#?\s*/i, "Court "));

  const matchCard = (m, i, roundName) => {
    const sideHtml = (side) => {
      const t = m[side];
      const won = m.winner === side, lost = m.winner && !won;
      const sets = m.sets.map(([w, l]) => won ? `<span class="w">${w}</span>` : `<span>${l}</span>`).join("");
      if (!t) return `<div class="side none tbd"><span class="nm"><span class="seed"></span>To be decided</span><span class="sets"></span></div>`;
      const seed = /^\d+$/.test(t.seed) ? "#" + t.seed : t.seed;
      return `<div class="side ${won ? "won" : lost ? "lost" : "none"}${mine(t.team) ? " mine" : ""}"><span class="nm"><span class="seed">${esc(seed)}</span>${esc(t.team)}</span><span class="sets">${m.winner ? sets : ""}</span></div>`;
    };
    const when = [m.day, m.time].filter(Boolean).join(" ");
    const tag = m.winner ? `<span class="tag final">Final</span>` : m.next ? `<span class="tag next">Up next</span>` : "";
    const loser = m.winner ? m[m.winner === "top" ? "bottom" : "top"] : null;
    const foot = [m.forfeit ? `${esc(m.forfeit)} didn't show (forfeit)` : "", m.format, m.loserTo ? (loser ? `${esc(loser.team)} moves to ${esc(m.loserTo)}` : `Loser moves to ${esc(m.loserTo)}`) : ""].filter(Boolean).join(". ");
    const flash = flashKeys.has(`${g.key}|m${m.r}-${m.c}`) ? " flash" : "";
    const followed = (m.top && mine(m.top.team)) || (m.bottom && mine(m.bottom.team)) ? " mine" : "";
    return `<div class="bmatch${flash}${followed}">
      <div class="mhead"><span>${esc(when)}${m.court ? ", " + courtName(m.court) : ""}</span>${tag}</div>
      ${sideHtml("top")}${sideHtml("bottom")}
      ${foot ? `<div class="foot">${foot}</div>` : ""}</div>`;
  };

  const rounds = g.rounds.map(rd => `<div class="round"><h3>${esc(rd.name)}</h3><div class="slots">${
    rd.matches.map((m, i) => matchCard(m, i, rd.name)).join("")}</div></div>`).join("");
  // 3rd place and the consolation side, below the bracket
  const extra = (g.extra || []).map(rd => `<div class="round"><h3>${esc(rd.name)}</h3><div class="slots">${
    rd.matches.map((m, i) => matchCard(m, i, rd.name)).join("")}</div></div>`).join("");

  const champ = g.champion ? `<div class="champ"><span class="lbl">Champion</span><span class="who">${esc(g.champion)}</span>${g.award ? `<span class="award">Wins ${esc(g.award)}</span>` : ""}</div>` : "";

  // Silver and Bronze tabs have no results table, so theirs is built from the matches and has no "Next" column
  const hasNext = g.results.some(r => r.adv);
  const results = g.results.length ? `<section class="card"><h3>Results</h3><table><thead><tr><th></th><th>Team</th>${hasNext ? "<th>Next</th>" : ""}</tr></thead><tbody>${
    g.results.map((r, i) => `<tr class="${mine(r.team) ? "mine" : ""}"><td class="rank">${esc(r.rank || i + 1)}</td><td><span class="team">${esc(r.team)}</span></td>${hasNext ? `<td>${esc(r.adv)}</td>` : ""}</tr>`).join("")
  }</tbody></table><p class="note">${hasNext ? "Final placement and where each team plays next, from the tournament sheet." : "Final placement from the match results."}</p></section>` : "";

  html += `<div class="pool-head"><h2>${esc(g.title)}</h2>${badge}</div>
    ${champ}
    <div class="bracket" style="--rounds:${g.rounds.length}">${rounds}</div>
    ${extra ? `<h2 class="subhead">Placement matches</h2><div class="bracket placements">${extra}</div>` : ""}
    ${results}
    ${model.note ? `<footer>${esc(model.note)}</footer>` : ""}`;
  $("main").innerHTML = html;
  flashKeys = new Set();
}

function renderListStatus() {
  const box = $("listStatus"); if (!box) return;
  const when = t => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const wait = Math.ceil(backoffLeft() / 60e3);
  const fromSheet = configDivs && configDivs.divs.length;
  const f = discovered.failed || [];
  let body = `<p>${fromSheet ? `The division list comes from your divisions sheet (${baseDivisions().length} divisions).`
      : "Your divisions sheet couldn't be read or is empty, so the saved list is showing."}
    To fill the sheet from the NCHVC index, copy the rows below and paste them into cell A1 of the sheet, replacing what's there.
    Rows already in the sheet keep their name and Show; tabs the viewer can't read yet come in with Show = No.</p>
    <p><textarea id="sheetRows" readonly rows="8" style="width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;white-space:pre;overflow:auto">${esc(sheetRows(discovered))}</textarea></p>
    <p class="row"><button class="refresh" type="button" id="copyRows">Copy rows</button>
      ${API_KEY ? (discovery ? `<span><strong>Reading the index…</strong> ${discovery.total ? `checked ${discovery.done} of ${discovery.total} tabs` : ""}</span>`
        : `<button class="ghost" type="button" id="updateList" ${wait ? "disabled" : ""}>Build rows from the NCHVC index</button>`) : ""}</p>
    <p style="color:var(--muted);font-size:14px">${discovered === SAVED_LIST ? `These rows come from the saved index discovery (${esc(when(discovered.at))}).` : `Rebuilt from the NCHVC index ${esc(when(discovered.at))}.`}
      ${API_KEY ? "Rebuilding uses the Google Sheets API (17 reads) and is only needed if the index changes, such as next year." : ""}
      ${wait ? ` Google asked us to slow down, so rebuilding is paused for about ${wait} minute${wait === 1 ? "" : "s"}.` : ""}</p>
    ${discoveryError && !discovery ? `<p style="color:var(--bad)">Rebuilding failed: ${esc(discoveryError)}</p>` : ""}
    ${f.length ? `<details><summary>${f.length} tab${f.length === 1 ? "" : "s"} couldn't be read (their layout isn't supported yet)</summary><ul>${
      f.map(x => `<li>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>` : esc(x.name)}${x.tab ? ` (${esc(x.book)}, tab “${esc(x.tab)}”)` : ""}: ${esc(x.reason)}</li>`).join("")}</ul></details>` : ""}`;
  box.innerHTML = `<h2>Division list</h2>${body}`;
  const b = $("updateList"); if (b) b.addEventListener("click", updateDivisionList);
  $("copyRows").addEventListener("click", async e => {
    const t = $("sheetRows"); t.select();
    try { await navigator.clipboard.writeText(t.value); } catch (err) { document.execCommand("copy"); }
    e.target.textContent = "Copied";
  });
}

function renderSetup() {
  const custom = settings.custom || [];
  $("main").innerHTML = `
    <div class="msg" id="listStatus"></div>
    <div class="msg"><h2>Add a division</h2>
      <p>Divisions added here are saved only on this device. To add one for everyone, add a row to the divisions sheet instead.</p>
      <p>Open that division's pool or bracket tab in Google Sheets and copy the link from the address bar. It should include <strong>#gid=</strong> so the viewer reads the right tab.</p></div>
    <form class="setup" id="setupForm">
      <label>Division name<input name="name" required placeholder="Boys 18U"></label>
      <label>What's on this tab
        <select name="type" style="font:16px Barlow,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)">
          <option value="pools" ${currentStage() === "pools" ? "selected" : ""}>Pool play</option><option value="brackets" ${currentStage() === "brackets" ? "selected" : ""}>Bracket play</option></select></label>
      <label>Google Sheet link<input name="url" required placeholder="https://docs.google.com/spreadsheets/d/…#gid=…"></label>
      <div class="row">
        <button class="refresh" type="submit">Add division</button>
        <button class="ghost" type="button" id="cancelBtn">Cancel</button>
      </div>
      ${custom.length ? `<div><p style="font-weight:600;margin:8px 0">Divisions you've added</p><ul class="custom-list">${
        custom.map(c => `<li><span>${esc(c.name)}</span><button class="ghost" type="button" data-remove="${esc(c.id)}">Remove</button></li>`).join("")}</ul></div>` : ""}
    </form>`;
  renderListStatus();
  $("setupForm").addEventListener("submit", e => {
    e.preventDefault();
    const f = new FormData(e.target);
    if (!linkParts(f.get("url"))) { alert("That doesn't look like a Google Sheets link."); return; }
    const div = { id: "c" + Date.now(), type: f.get("type") || "pools", name: f.get("name").trim(), url: f.get("url").trim() };
    settings.custom = [...custom, div]; settings.division = div.id; settings.stage = div.type; save();
    setup = false; render(); refresh();
  });
  $("cancelBtn").addEventListener("click", () => { setup = false; render(); });
  $("main").querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => {
    settings.custom = custom.filter(c => c.id !== b.dataset.remove);
    if (!divisions().some(d => d.id === settings.division)) settings.division = DIVISIONS[0].id;
    save(); renderSetup(); renderDivisions();
  }));
}

/* ---------------- wiring ---------------- */
$("refreshBtn").addEventListener("click", async () => { await loadConfig(); render(); refresh(); });
$("stages").addEventListener("click", e => {
  const b = e.target.closest("button[data-stage]"); if (!b || b.dataset.stage === currentStage() && !setup) return;
  settings.lastByStage = { ...(settings.lastByStage || {}), [currentStage()]: current().id };
  settings.stage = b.dataset.stage;
  const remembered = (settings.lastByStage || {})[settings.stage];
  const options = visibleDivisions(settings.stage);
  settings.division = (options.find(d => d.id === remembered) || options[0] || {}).id;
  setup = false; flashKeys = new Set(); save(); render();
  const s = slot(current().id);
  if (!s.lastUpdated || Date.now() - s.lastUpdated > 30000) refresh();
});
function clearFilters() {
  settings.sharedFilters = {};
  save(); afterFilterChange();
}
function afterFilterChange() {
  flashKeys = new Set(); render();
  const d = current(); if (d.id === "__none") return;
  settings.division = d.id; save();
  const s = slot(d.id);
  if (!s.lastUpdated || Date.now() - s.lastUpdated > 30000) refresh();
}
$("filters").addEventListener("change", e => {
  const sel = e.target.closest("select[data-filter]"); if (!sel) return;
  settings.sharedFilters = { ...allFilters(), [sel.dataset.filter]: sel.value };
  save(); afterFilterChange();
});
$("filters").addEventListener("click", e => { if (e.target.closest("#clearFilters")) clearFilters(); });
$("divs").addEventListener("click", e => {
  if (e.target.closest("#addDiv")) { setup = true; render(); return; }
  const b = e.target.closest("button[data-div]"); if (!b) return;
  setup = false; settings.division = b.dataset.div; save(); flashKeys = new Set();
  render();
  const s = slot(settings.division);
  if (!s.lastUpdated || Date.now() - s.lastUpdated > 30000) refresh();
});
$("pools").addEventListener("click", e => { const b = e.target.closest("button[data-pool]"); if (b) { slot(current().id).active = b.dataset.pool; render(); } });
$("followSel").addEventListener("change", e => {
  settings.follow = e.target.value; save();
  const s = slot(current().id);
  if (s.model && s.model.kind === "brackets") {
    const g = s.model.brackets.find(x => x.teams.includes(settings.follow));
    if (g) s.active = g.key;
  } else {
    const p = s.model && s.model.pools.find(x => x.teams.some(t => t.team === settings.follow));
    if (p) s.active = p.letter;
  }
  render();
});
$("autoChk").addEventListener("change", e => setAuto(e.target.checked));
function setAuto(on) {
  clearInterval(autoTimer);
  if (on) autoTimer = setInterval(() => { if (!setup && !document.hidden) refresh(); }, AUTO_SECONDS * 1000);
  settings.auto = on; save();
}
setInterval(updateStatus, 30000);
if (settings.auto) { $("autoChk").checked = true; setAuto(true); }
render();
(async () => { await loadConfig(); render(); refresh(); })();
</script>
</body>
</html>
